openapi: "3.1.0"
info:
  title: Cineva API
  description: >
    Self-hosted media suite API. This spec is the contract: it is updated in
    the same change as the handlers it describes.
  version: 0.1.0
servers:
  - url: /api/v1

paths:
  /health:
    get:
      summary: Liveness check
      operationId: getHealth
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  service: { type: string }
                  version: { type: string }

  /themes:
    get:
      summary: List UI themes
      operationId: listThemes
      responses:
        "200":
          description: Available themes (folders under /themes)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Theme" }

  # ---- Authentication & users (milestone 4) ----
  # Every endpoint except /health, /themes, /auth/status, /auth/login and
  # /auth/setup requires a signed-in caller: the cineva_session cookie
  # (browsers) or an API key via `Authorization: Bearer cnv_…` /
  # `X-Api-Key` (clients). Admin-only endpoints answer 403 to regular
  # users. Library-scoped endpoints answer 404 for libraries the caller
  # has not been granted; admins see every library.
  /auth/status:
    get:
      summary: Setup state and the caller's identity (public)
      operationId: authStatus
      responses:
        "200":
          description: setupRequired is true until the first admin exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  setupRequired: { type: boolean }
                  loginMode: { type: string, enum: [picker, form], description: What the sign-in screen shows (admin setting) }
                  user: { $ref: "#/components/schemas/User" }
  /auth/setup:
    post:
      summary: Create the first admin (public; 409 once any user exists)
      operationId: authSetup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201": { description: Admin created and signed in, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Setup already completed }
  /auth/login:
    post:
      summary: Sign in (sets the session cookie)
      description: The password field also accepts the user's PIN, when they have one.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { description: Incorrect username or password (or account disabled) }
  /auth/profiles:
    get:
      summary: Sign-in profile picker (public)
      description: >
        Every enabled user, for the "Who's watching?" tiles. Empty when the
        sign-in screen is in form mode, so no names are revealed then.
      operationId: authProfiles
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    username: { type: string }
                    displayName: { type: string }
                    hasPassword: { type: boolean, description: The user may switch to password sign-in }
                    hasPin: { type: boolean, description: Ask for a PIN; otherwise ask for the password }
  /auth/pin:
    post:
      summary: Quick sign-in with a PIN (public)
      description: >
        Five wrong PINs lock that user's PIN sign-in for 30 s, doubling per
        further failure up to 15 minutes (429 with Retry-After). Password
        sign-in is throttled the same way per username.
      operationId: authPINLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, pin]
              properties:
                userId: { type: string }
                pin: { type: string, pattern: "^[0-9]{4,6}$" }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { description: Incorrect PIN }
        "429": { description: Locked out — see Retry-After }
  /auth/pin/set:
    post:
      summary: Set or remove own quick sign-in PIN
      description: >
        Requires the current password (or, for PIN-only accounts, the
        current PIN) in `password`. pin "" removes the PIN, which is refused
        for accounts that have no password.
      operationId: authSetPIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, pin]
              properties:
                password: { type: string }
                pin: { type: string, description: "4–6 digits, or empty to remove" }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Current password/PIN incorrect }

  /auth/logout:
    post:
      summary: Sign out this session
      operationId: authLogout
      responses:
        "204": { description: Signed out }
  /auth/me:
    get:
      summary: The signed-in user
      operationId: authMe
      responses:
        "200": { description: User, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /auth/password:
    post:
      summary: Change own password (other sessions are signed out)
      operationId: authPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, new]
              properties:
                current: { type: string }
                new: { type: string, minLength: 8 }
      responses:
        "204": { description: Changed }
        "403": { description: Current password incorrect }
  /auth/keys:
    get:
      summary: List own API keys
      operationId: listAPIKeys
      responses:
        "200": { description: Keys (never the secret), content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/APIKey" } } } } }
    post:
      summary: Create an API key — the secret is returned exactly once
      operationId: createAPIKey
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string } } }
      responses:
        "201":
          description: Key created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIKey"
                  - type: object
                    properties:
                      key: { type: string, description: "Bearer secret, prefixed cnv_; shown only here" }
  /auth/keys/{id}:
    delete:
      summary: Revoke an API key
      operationId: deleteAPIKey
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
  /settings:
    get:
      summary: Runtime settings (admin)
      operationId: getSettings
      responses:
        "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
    put:
      summary: Change runtime settings (admin) — only the fields sent change
      operationId: putSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200": { description: Updated settings, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /users:
    get:
      summary: List users (admin)
      operationId: listUsers
      responses:
        "200": { description: Users, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
        "403": { description: Admin only }
    post:
      summary: Create a user (admin)
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Update a user — display name, role, disabled, library grants, optional password reset (admin)
      description: Resetting the password or disabling signs the user out everywhere. Admins cannot demote, disable or delete themselves.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRequest" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a user and everything of theirs (admin)
      operationId: deleteUser
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries:
    get:
      summary: List libraries
      operationId: listLibraries
      responses:
        "200":
          description: All libraries with playable-item counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Library" }
    post:
      summary: Create a library
      description: >
        A library has exactly one media type, chosen at creation and immutable
        afterwards. Multiple libraries per type are allowed; a library never
        spans types.
      operationId: createLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mediaType, paths]
              properties:
                name: { type: string }
                mediaType: { $ref: "#/components/schemas/MediaType" }
                paths:
                  type: array
                  items: { type: string }
                  minItems: 1
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /libraries/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a library
      operationId: getLibrary
      responses:
        "200":
          description: The library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a library and its scanned items (files on disk untouched)
      operationId: deleteLibrary
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries/{id}/scan:
    post:
      summary: Start a background scan of the library
      operationId: scanLibrary
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Scan started; poll /scans for progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scan" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: A scan for this library is already running }

  /libraries/{id}/items:
    get:
      summary: List all items in a library
      operationId: libraryItems
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Items, all kinds (movie, series, season, episode)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }

  /items/{id}:
    get:
      summary: Get an item with its direct children
      operationId: getItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Item detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/Item" }
                  children:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
        "404": { $ref: "#/components/responses/NotFound" }

  /scans:
    get:
      summary: List recent scans, newest first
      operationId: listScans
      responses:
        "200":
          description: Recent scan runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scan" }

  /search:
    get:
      summary: Universal title search over movies, series, and episodes
      operationId: search
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        "200":
          description: Matching items (series/movies ranked above episodes, max 20)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }

  /events:
    get:
      summary: Live server events (SSE)
      description: >
        A Server-Sent Events stream of state changes so clients update
        without polling. Event types: "scan" (data: a Scan, plus filesTotal
        while running — the scanner's upfront file count) and "libraries"
        (no data — an invalidation hint: refetch library lists and counts).
        Events are advisory; clients refetch what they display on receipt.
      operationId: eventStream
      responses:
        "200":
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema: { type: string }

  /fs/dirs:
    get:
      summary: List subdirectories of a server path (admin folder picker)
      description: >
        Directories only, one level at a time — never file contents. Hidden
        (dot) directories are omitted unless hidden=1. Symlinked directories
        are followed so linked media mounts are browsable.
      operationId: listDirs
      parameters:
        - { name: path, in: query, required: false, schema: { type: string }, description: Absolute path (default "/") }
        - { name: hidden, in: query, required: false, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  parent: { type: string }
                  dirs:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        path: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Permission denied }
        "404": { $ref: "#/components/responses/NotFound" }

  /stats/system:
    get:
      summary: Host CPU/RAM samples for the admin dashboard
      description: >
        In-memory samples only: range=1h returns every sample from the last
        hour (default 5 s apart); range=24h returns one per minute for the
        last day. Live samples are also pushed on the /events stream as
        "stats" events.
      operationId: systemStats
      parameters:
        - { name: range, in: query, required: false, schema: { type: string, enum: [1h, 24h], default: 1h } }
      responses:
        "200":
          description: Samples, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    at: { type: string, format: date-time }
                    cpuPct: { type: number, description: Whole-host CPU busy, 0–100 }
                    memUsed: { type: integer, description: Bytes (MemTotal − MemAvailable) }
                    memTotal: { type: integer }
                    procRss: { type: integer, description: This server's resident set, bytes }
                    numCpu: { type: integer }

  /stats/plays:
    get:
      summary: Plays per day by media kind
      description: >
        One entry per UTC day for the last `days` days including empty days.
        Every POST /items/{id}/play is recorded; a "plays" event is pushed on
        the /events stream when the history changes.
      operationId: playStats
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, default: 30, maximum: 365 } }
      responses:
        "200":
          description: Days, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date: { type: string, format: date }
                    movies: { type: integer }
                    episodes: { type: integer }
                    tracks: { type: integer }

  /items/{id}/playback:
    delete:
      summary: Client has stopped playing the item
      description: >
        Drops the item from the active-playback list immediately (and tears
        down its transcode session, if any). Without this, an entry lingers
        until the client misses its progress heartbeats (45 s).
      operationId: stopPlayback
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Stopped }

  /items/{id}/playback/stop:
    post:
      summary: Beacon-friendly alias of DELETE /items/{id}/playback
      description: navigator.sendBeacon can only POST; used on page unload.
      operationId: stopPlaybackBeacon
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Stopped }

  /stats/disks:
    get:
      summary: Disk space on every filesystem backing a library
      description: >
        Library paths on the same filesystem are grouped into one volume.
        freeBytes is what an unprivileged writer could use. Paths that cannot
        be stat'ed are listed last with an error.
      operationId: diskStats
      responses:
        "200":
          description: Volumes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    paths: { type: array, items: { type: string } }
                    libraries: { type: array, items: { type: string } }
                    totalBytes: { type: integer }
                    freeBytes: { type: integer }
                    usedBytes: { type: integer }
                    error: { type: string }

  /logs:
    get:
      summary: Audit trail — who did what, when, from where
      description: >
        Newest first. Actions are dotted verbs (library.create,
        library.delete, scan.start, scan.cancel, scan.completed, scan.failed,
        play.start, download, transcode.stop); `action` filters by prefix.
        Scan completions are recorded by user "system". A "logs" event is
        pushed on /events whenever an entry is added.
      operationId: auditLog
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 100, maximum: 500 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
        - { name: action, in: query, required: false, schema: { type: string }, description: Action prefix filter }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    at: { type: string }
                    userId: { type: string }
                    action: { type: string }
                    targetKind: { type: string }
                    targetId: { type: string }
                    targetTitle: { type: string }
                    detail: { type: string }
                    clientIp: { type: string }
                    client: { type: string, description: "Browser · OS" }

  /scans/{id}/cancel:
    post:
      summary: Cancel a running scan
      description: >
        Scans owned by this server process stop within one file; a stale
        'running' row left by a dead process is marked failed. Starting a
        scan while one is running for the same library is rejected with 409
        (the scans table is the cross-process lock).
      operationId: cancelScan
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Cancellation initiated (or stale row cleared) }
        "409": { description: Scan is not running }

  /items/{id}/play:
    post:
      summary: Start playback — decides direct play vs HLS transcode
      description: >
        The body optionally carries the device's decode capabilities (detected
        client-side) and a quality choice. quality "auto" negotiates (direct
        play when capable, else remux with AAC audio); "original" forces
        direct play; "1080p"/"720p"/"480p" force a video re-encode at that
        level. Starting playback replaces any existing session for the item.
        Music tracks always answer direct play (browsers decode
        flac/mp3/aac/ogg/opus natively); capabilities/quality are ignored for
        them. The music hierarchy (artist -> album -> ordered tracks) is
        served by the same /libraries/{id}/items and /items/{id} endpoints.
      operationId: playItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                containers: { type: array, items: { type: string } }
                videoCodecs: { type: array, items: { type: string } }
                audioCodecs: { type: array, items: { type: string } }
                quality:
                  type: string
                  enum: [auto, original, 1080p, 720p, 480p]
                fromStart:
                  type: boolean
                  description: Ignore the stored resume position and play from 00:00
      responses:
        "200":
          description: How to play the item, including the resume position
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{id}/stream:
    get:
      summary: Direct play the original file (supports HTTP range requests)
      operationId: streamItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [original, opus, aac, mp3, ogg] }, description: Music only — stream a cached transcode instead of the file (Opus for bandwidth, AAC as the universal browser fallback) }
        - { name: quality, in: query, required: false, schema: { type: integer, enum: [64, 96, 128, 192, 256, 320] }, description: Bitrate in kbps for transcoded formats (default 192) }
      responses:
        "200": { description: The media file }
        "206": { description: Partial content (range request) }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{id}/download:
    get:
      summary: Download an item — original file, or a streamed ZIP for containers
      description: >
        Playable items (movie, episode, track) download their original file.
        Container items (season, series, album, artist) stream a stored
        (uncompressed) ZIP of every descendant file, one folder level per
        container ("Season 02/...").
      operationId: downloadItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [original, mp3, ogg] }, description: Music only — transcode tracks (or every track in an album/artist ZIP) }
        - { name: quality, in: query, required: false, schema: { type: integer, enum: [128, 192, 256, 320] }, description: Bitrate in kbps for transcoded formats (default 192) }
      responses:
        "200": { description: The media file or ZIP archive, Content-Disposition attachment }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{id}/progress:
    post:
      summary: Report playback position (crossing ~90% marks the item watched)
      operationId: postProgress
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionSecs]
              properties:
                positionSecs: { type: integer }
                paused: { type: boolean, description: Sent with each heartbeat (every 15 s, even while paused) so the admin Activity page can show state; music positions are not stored as resume state }
      responses:
        "200":
          description: Updated play state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayState" }

  /items/{id}/next:
    get:
      summary: Server-side next-up decision — the episode after this one
      operationId: nextUp
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The next episode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "204": { description: No next episode (end of series, or not an episode) }

  /items/{id}/subtitles:
    get:
      summary: List an item's subtitle tracks (embedded and sidecar)
      operationId: itemSubtitles
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Subtitle tracks; text tracks carry a WebVTT url
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubtitleTrack" }

  /subtitles/{id}.vtt:
    get:
      summary: A text subtitle track extracted/converted to WebVTT (cached server-side)
      operationId: subtitleVTT
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: WebVTT content
          content:
            text/vtt: {}
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Image-based track — needs burn-in, not yet available }

  /continue-watching:
    get:
      summary: In-progress items for the home screen, most recent first
      operationId: continueWatching
      responses:
        "200":
          description: Items with resume positions
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - { $ref: "#/components/schemas/Item" }
                    - type: object
                      properties:
                        positionSecs: { type: integer }

  /play/sessions:
    get:
      summary: Everything playing right now — direct or transcoded, video or music
      description: >
        One entry per active playback (user + item) with client details
        (IP, browser, OS from the User-Agent), mode/quality, position and
        paused state from the client's heartbeats, and the live transcode
        session when there is one. Entries expire 45 s after the last
        heartbeat. A "sessions" event is pushed on /events on every change.
      operationId: listSessions
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlaySession" }

  /play/{sid}/index.m3u8:
    get:
      summary: HLS VOD playlist for a session
      operationId: hlsPlaylist
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The playlist
          content:
            application/vnd.apple.mpegurl: {}
        "404": { $ref: "#/components/responses/NotFound" }

  /play/{sid}/{file}:
    get:
      summary: HLS session asset (init.mp4 or segNNNNN.m4s); blocks until produced, seeking restarts the transcoder
      operationId: hlsFile
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The segment }
        "404": { $ref: "#/components/responses/NotFound" }
        "504": { description: Segment not produced in time }

  /play/{sid}:
    delete:
      summary: Stop a playback session and delete its temp files
      operationId: stopSession
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Stopped }

components:
  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, user] }
        disabled: { type: boolean }
        hasPassword: { type: boolean }
        hasPin: { type: boolean }
        createdAt: { type: string }
        libraryIds: { type: array, items: { type: string }, description: Granted libraries (admins see all regardless) }
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, minLength: 8 }
        displayName: { type: string }
    UserRequest:
      type: object
      properties:
        username: { type: string, description: Create only }
        displayName: { type: string }
        password: { type: string, minLength: 8, description: On create, required unless a PIN is given (admins always); on update, resets it }
        role: { type: string, enum: [admin, user] }
        disabled: { type: boolean }
        libraryIds: { type: array, items: { type: string } }
        pin: { type: string, description: "Quick sign-in PIN (4–6 digits); on update, empty string removes it. A regular user may be PIN-only (no password); admins must have a password." }
    Settings:
      type: object
      properties:
        loginMode:
          type: string
          enum: [picker, form]
          description: picker = every user as a tile, then their PIN or password; form = username + password-or-PIN box. Default from auth.login_mode.
    APIKey:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
        createdAt: { type: string }
        lastUsedAt: { type: string }
    MediaType:
      type: string
      enum: [movies, tv, music, audiobooks, podcasts, books]

    Theme:
      type: object
      properties:
        id: { type: string, description: Folder name; stylesheet at /themes/{id}/theme.css }
        name: { type: string }
        appearance: { type: string, enum: [dark, light] }

    Library:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mediaType: { $ref: "#/components/schemas/MediaType" }
        source: { type: string, enum: [local, federated] }
        paths:
          type: array
          items: { type: string }
        itemCount: { type: integer, description: Playable items (movies + episodes) }
        createdAt: { type: string }
        updatedAt: { type: string }

    Item:
      type: object
      properties:
        id: { type: string, format: uuid }
        libraryId: { type: string, format: uuid }
        kind: { type: string, enum: [movie, series, season, episode, artist, album, track] }
        parentId: { type: string }
        title: { type: string }
        year: { type: integer }
        seasonNum: { type: integer }
        episodeNum: { type: integer }
        discNum: { type: integer }
        trackNum: { type: integer }
        artist: { type: string, description: Display artist (music kinds) }
        path: { type: string }
        sizeBytes: { type: integer, format: int64 }
        runtimeSecs: { type: integer }
        container: { type: string }
        videoCodec: { type: string }
        audioCodec: { type: string }
        width: { type: integer }
        height: { type: integer }
        tmdbId: { type: integer }
        overview: { type: string }
        poster: { type: string, description: Server-relative artwork URL (/artwork/...) }
        addedAt: { type: string }
        updatedAt: { type: string }

    PlayInfo:
      type: object
      properties:
        mode: { type: string, enum: [direct, hls] }
        url: { type: string }
        sessionId: { type: string }
        durationSecs: { type: integer }
        positionSecs: { type: integer, description: Resume point }
        reason: { type: string, description: Why transcoding was chosen }
        subtitles:
          type: array
          items: { $ref: "#/components/schemas/SubtitleTrack" }

    SubtitleTrack:
      type: object
      properties:
        id: { type: string, format: uuid }
        language: { type: string }
        title: { type: string }
        codec: { type: string, description: subrip/ass/mov_text/vtt (text) or hdmv_pgs_subtitle/dvd_subtitle (image) }
        forced: { type: boolean }
        url: { type: string, description: WebVTT url; absent for image-based tracks }

    PlayState:
      type: object
      properties:
        itemId: { type: string }
        positionSecs: { type: integer }
        watched: { type: boolean }
        updatedAt: { type: string }

    PlaySession:
      type: object
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        title: { type: string }
        segmentSecs: { type: integer }
        numSegments: { type: integer }

    Scan:
      type: object
      properties:
        id: { type: string, format: uuid }
        libraryId: { type: string, format: uuid }
        status: { type: string, enum: [running, completed, failed] }
        filesSeen: { type: integer }
        itemsCreated: { type: integer }
        error: { type: string }
        startedAt: { type: string }
        finishedAt: { type: string }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }

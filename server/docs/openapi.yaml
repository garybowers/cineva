openapi: "3.1.0"
info:
  title: Cineva API
  description: >
    Self-hosted media suite API. This spec is the contract: it is updated in
    the same change as the handlers it describes.
  version: 0.1.0
servers:
  - url: /api/v1

paths:
  /health:
    get:
      summary: Liveness check
      operationId: getHealth
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  service: { type: string }
                  version: { type: string }

  /themes:
    get:
      summary: List UI themes
      operationId: listThemes
      responses:
        "200":
          description: Available themes (folders under /themes)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Theme" }

  # ---- Authentication & users (milestone 4) ----
  # Every endpoint except /health, /themes, /auth/status, /auth/login and
  # /auth/setup requires a signed-in caller: the cineva_session cookie
  # (browsers) or an API key via `Authorization: Bearer cnv_…` /
  # `X-Api-Key` (clients). Admin-only endpoints answer 403 to regular
  # users. Library-scoped endpoints answer 404 for libraries the caller
  # has not been granted; admins see every library.
  /auth/status:
    get:
      summary: Setup state and the caller's identity (public)
      operationId: authStatus
      responses:
        "200":
          description: setupRequired is true until the first admin exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  setupRequired: { type: boolean }
                  loginMode: { type: string, enum: [picker, form], description: What the sign-in screen shows (admin setting) }
                  user: { $ref: "#/components/schemas/User" }
  /auth/setup:
    post:
      summary: Create the first admin (public; 409 once any user exists)
      operationId: authSetup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201": { description: Admin created and signed in, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Setup already completed }
  /auth/login:
    post:
      summary: Sign in (sets the session cookie)
      description: The password field also accepts the user's PIN, when they have one.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { description: Incorrect username or password (or account disabled) }
  /auth/profiles:
    get:
      summary: Sign-in profile picker (public)
      description: >
        Every enabled user, for the "Who's watching?" tiles. Empty when the
        sign-in screen is in form mode, so no names are revealed then.
      operationId: authProfiles
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    username: { type: string }
                    displayName: { type: string }
                    hasPassword: { type: boolean, description: The user may switch to password sign-in }
                    hasPin: { type: boolean, description: Ask for a PIN; otherwise ask for the password }
  /auth/pin:
    post:
      summary: Quick sign-in with a PIN (public)
      description: >
        Five wrong PINs lock that user's PIN sign-in for 30 s, doubling per
        further failure up to 15 minutes (429 with Retry-After). Password
        sign-in is throttled the same way per username.
      operationId: authPINLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, pin]
              properties:
                userId: { type: string }
                pin: { type: string, pattern: "^[0-9]{4,6}$" }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { description: Incorrect PIN }
        "429": { description: Locked out — see Retry-After }
  /auth/pin/set:
    post:
      summary: Set or remove own quick sign-in PIN
      description: >
        Requires the current password (or, for PIN-only accounts, the
        current PIN) in `password`. pin "" removes the PIN, which is refused
        for accounts that have no password.
      operationId: authSetPIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, pin]
              properties:
                password: { type: string }
                pin: { type: string, description: "4–6 digits, or empty to remove" }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Current password/PIN incorrect }

  /auth/logout:
    post:
      summary: Sign out this session
      operationId: authLogout
      responses:
        "204": { description: Signed out }
  /auth/me:
    get:
      summary: The signed-in user
      operationId: authMe
      responses:
        "200": { description: User, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /auth/password:
    post:
      summary: Change own password (other sessions are signed out)
      operationId: authPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, new]
              properties:
                current: { type: string }
                new: { type: string, minLength: 8 }
      responses:
        "204": { description: Changed }
        "403": { description: Current password incorrect }
  /auth/keys:
    get:
      summary: List own API keys
      operationId: listAPIKeys
      responses:
        "200": { description: Keys (never the secret), content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/APIKey" } } } } }
    post:
      summary: Create an API key — the secret is returned exactly once
      operationId: createAPIKey
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string } } }
      responses:
        "201":
          description: Key created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIKey"
                  - type: object
                    properties:
                      key: { type: string, description: "Bearer secret, prefixed cnv_; shown only here" }
  /auth/keys/{id}:
    delete:
      summary: Revoke an API key
      operationId: deleteAPIKey
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
  /settings:
    get:
      summary: Runtime settings (admin)
      operationId: getSettings
      responses:
        "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
    put:
      summary: Change runtime settings (admin) — only the fields sent change
      operationId: putSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200": { description: Updated settings, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /users:
    get:
      summary: List users (admin)
      operationId: listUsers
      responses:
        "200": { description: Users, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
        "403": { description: Admin only }
    post:
      summary: Create a user (admin)
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Update a user — display name, role, disabled, library grants, optional password reset (admin)
      description: Resetting the password or disabling signs the user out everywhere. Admins cannot demote, disable or delete themselves.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRequest" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a user and everything of theirs (admin)
      operationId: deleteUser
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups:
    get:
      summary: List user groups (admin)
      description: Named sets of this server's users ("Kids", "Grown-ups"), for restricting libraries without listing every account.
      operationId: listGroups
      responses:
        "200":
          description: Groups, by name
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/UserGroup" } }
    post:
      summary: Create a group (admin)
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserGroupRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserGroup" }
        "400": { description: Missing or duplicate name, or an unknown member }

  /groups/{id}:
    put:
      summary: Rename a group and replace its members (admin)
      operationId: updateGroup
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserGroupRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserGroup" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a group (admin); it is also removed from every library's access list
      operationId: deleteGroup
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries/{id}/access:
    get:
      summary: Who may see a library (admin)
      operationId: getLibraryAccess
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The library's access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryAccess" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Set who may see a library (admin)
      description: >
        Libraries are open to every user by default. Restricting one limits
        it to the users and groups listed (admins always see everything); a
        restricted library with empty lists is admin-only. The lists are kept
        when a library is reopened, so restricting it again restores them.
      operationId: setLibraryAccess
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryAccess" }
      responses:
        "200":
          description: The access now in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryAccess" }
        "400": { description: An unknown user or group }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries:
    get:
      summary: List libraries
      operationId: listLibraries
      responses:
        "200":
          description: All libraries with playable-item counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Library" }
    post:
      summary: Create a library
      description: >
        A library has exactly one media type, chosen at creation and immutable
        afterwards. Multiple libraries per type are allowed; a library never
        spans types.
      operationId: createLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mediaType, paths]
              properties:
                name: { type: string }
                mediaType: { $ref: "#/components/schemas/MediaType" }
                paths:
                  type: array
                  items: { type: string }
                  minItems: 1
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /libraries/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a library
      operationId: getLibrary
      responses:
        "200":
          description: The library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a library and its scanned items (files on disk untouched)
      operationId: deleteLibrary
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries/{id}/scan:
    post:
      summary: Start a background scan of the library
      description: >
        Incremental by default: a file whose size and modification time match
        what the last scan recorded is skipped, and only new or changed files
        are read and matched. Items whose files have gone are removed either
        way. Pass full=true to reread and rematch everything, which picks up
        new provider data and recovers from a bad match.
      operationId: scanLibrary
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: full
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Reread and rematch every file instead of only changed ones
      responses:
        "202":
          description: Scan started; poll /scans for progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scan" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: A scan for this library is already running }

  /libraries/{id}/items:
    get:
      summary: List all items in a library
      operationId: libraryItems
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Items, all kinds (movie, series, season, episode)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }

  /items/{id}:
    get:
      summary: Get an item with its direct children
      operationId: getItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Item detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/Item" }
                  children:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
        "404": { $ref: "#/components/responses/NotFound" }

  /scans:
    get:
      summary: List recent scans, newest first
      operationId: listScans
      responses:
        "200":
          description: Recent scan runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scan" }

  /segments/status:
    get:
      summary: Progress of background intro and credits detection (admin)
      description: >
        Detection runs over TV libraries after each completed scan and once
        at startup, analysing only episodes not yet analysed for each kind.
        Counts are of checks: an episode is checked once for its intro and
        once for its credits. The same status is pushed over /events as
        "segments" while it runs.
      operationId: segmentStatus
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean, description: "False when libraries.intro_detection is off" }
                  running: { type: boolean }
                  libraryId: { type: string }
                  startedAt: { type: string, format: date-time }
                  seasonsDone: { type: integer }
                  seasonsTotal: { type: integer }
                  episodesDone: { type: integer }
                  episodesTotal: { type: integer, description: Episodes waiting when the run began }
                  introsFound: { type: integer, description: Episodes given an intro in this run }
                  creditsFound: { type: integer, description: Episodes given end credits in this run }
                  unreadable: { type: integer, description: Files whose audio could not be decoded }
                  paused: { type: boolean }
                  pauseReason:
                    type: string
                    enum: [manual, playing, scanning]
                    description: manual = paused by an admin until resumed; playing / scanning = giving way, resuming a minute after they stop
                  current:
                    type: object
                    description: The season being worked on
                    properties:
                      series: { type: string }
                      season: { type: integer }
                      kind: { type: string, enum: [intro, credits] }
                      phase: { type: string, enum: [reading, comparing, saving] }
                      done: { type: integer }
                      total: { type: integer }
                  recent:
                    type: array
                    description: The latest episodes' outcomes, newest first
                    items:
                      type: object
                      properties:
                        itemId: { type: string }
                        kind: { type: string, enum: [intro, credits] }
                        series: { type: string }
                        season: { type: integer }
                        episode: { type: integer }
                        found: { type: boolean }
                        startSecs: { type: number }
                        endSecs: { type: number }
                  last:
                    type: object
                    description: Summary of the most recent finished run
                    properties:
                      libraryId: { type: string }
                      finishedAt: { type: string, format: date-time }
                      seconds: { type: integer }
                      seasons: { type: integer }
                      episodes: { type: integer }
                      introsFound: { type: integer }
                      creditsFound: { type: integer }
                      unreadable: { type: integer }
                      cancelled: { type: boolean }

  /segments/pause:
    post:
      summary: Pause intro and credits detection until resumed (admin); kept across restarts
      operationId: pauseSegments
      responses:
        "200": { description: The detection status, now paused }
        "409": { description: Detection is turned off (libraries.intro_detection) }

  /segments/resume:
    post:
      summary: Resume intro and credits detection (admin)
      operationId: resumeSegments
      responses:
        "200": { description: The detection status }
        "409": { description: Detection is turned off (libraries.intro_detection) }

  /search:
    get:
      summary: Universal title search over movies, series, and episodes
      operationId: search
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        "200":
          description: Matching items (series/movies ranked above episodes, max 20)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }

  /events:
    get:
      summary: Live server events (SSE)
      description: >
        A Server-Sent Events stream of state changes so clients update
        without polling. Event types: "scan" (data: a Scan, plus filesTotal
        while running — the scanner's upfront file count; admin-only),
        "items" (data: {libraryId} — that library's contents changed,
        published repeatedly during a scan as items land so open views fill
        in live) and "libraries" (no data — an invalidation hint: refetch
        library lists and counts). Events are advisory; clients refetch what
        they display on receipt, and a dropped event costs staleness until
        the next one, not correctness.
      operationId: eventStream
      responses:
        "200":
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema: { type: string }

  /items/{id}/matches:
    get:
      summary: Candidate TMDB matches for an item (admin)
      description: >
        Used by the admin "Fix match" dialogue. q and year default to the
        item's own, so the common case needs no arguments. All candidates are
        returned rather than just the best: TMDB's year parameter only nudges
        relevance rather than filtering, so the top hit is regularly wrong for
        a common title.
      operationId: itemMatches
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: q, in: query, required: false, schema: { type: string }, description: Title to search for (default the item's own) }
        - { name: year, in: query, required: false, schema: { type: integer }, description: Year hint; 0 drops it }
      responses:
        "200":
          description: Candidates, best first
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  year: { type: integer }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/MatchCandidate" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: No TMDB key configured }

  /items/{id}/match:
    put:
      summary: Pin an item to a chosen TMDB title (admin)
      description: >
        The "fix match" operation. Unlike a scan this replaces the title,
        overview and artwork outright — the operator has just asserted which
        film it is, so keeping what the wrong match left behind would defeat
        the point.
      operationId: applyMatch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tmdbId]
              properties:
                tmdbId: { type: integer }
      responses:
        "200": { description: Updated item, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { description: No TMDB key configured }

  /items/{id}/refresh:
    post:
      summary: Re-run metadata matching for an item (admin)
      description: >
        Re-derives the title from the file path rather than the stored title,
        so a refresh also recovers from an earlier bad match having
        overwritten it.
      operationId: refreshItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Updated item, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        "404": { description: No match found }
        "503": { description: No TMDB key configured }

  /people/{id}:
    get:
      summary: A person and the library titles they are credited on
      description: >
        Backs "more with this actor". Only titles the viewer may see are
        returned, so a person credited on a library this user has no grant
        for does not leak its contents.
      operationId: getPerson
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Person and their titles
          content:
            application/json:
              schema:
                type: object
                properties:
                  person: { $ref: "#/components/schemas/Person" }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries/{id}/genres:
    get:
      summary: The genres this library actually holds, with counts
      description: >
        Derived from the films rather than a fixed vocabulary, so a library
        never offers a genre nothing is tagged with. Alternative versions are
        excluded, so a film held twice counts once.
      operationId: libraryGenres
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Genres, most common first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    genre: { type: string }
                    count: { type: integer }

  /libraries/{id}/recommended:
    get:
      summary: The library's Recommended tab, as rows of items
      description: >
        Built server-side so every client shows the same rows. Recently added
        leads, ranked as on the home screen — series by their newest episode
        for TV — and is left out for media types without that listing. The
        rest are recommendations for the viewer: because you watched, highly
        rated and unseen, genre rows and unwatched. Every item carries the
        viewer's own watch state.
      operationId: libraryRecommended
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Rows in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [kind, title, items]
                  properties:
                    kind: { type: string, enum: [recent, because, toprated, genre, unwatched] }
                    title: { type: string }
                    genre: { type: string, description: Set on a genre row, so its heading can open the full genre listing }
                    items:
                      type: array
                      items: { $ref: "#/components/schemas/Item" }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries/{id}/collections:
    get:
      summary: The collections this library holds more than one film from
      description: >
        Collections come from the metadata provider's own grouping (TMDB's
        belongs_to_collection), so Harry Potter, James Bond, The Lord of the
        Rings and the rest are detected without any franchise list of our
        own — a film simply has to be matched. A collection the library holds
        only one film from is excluded: labelling a single film as a set is
        noise rather than grouping. Alternative versions are excluded, so a
        film held twice counts once.
      operationId: libraryCollections
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Collections, largest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Collection" }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries/{id}/collections/{cid}:
    get:
      summary: One collection's films, in release order
      operationId: collectionItems
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cid, in: path, required: true, schema: { type: integer }, description: Provider collection id }
      responses:
        "200":
          description: Films in release order, which is how a series is watched
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /integrations:
    get:
      summary: List connected Sonarr and Radarr instances (admin)
      description: >
        Cineva registers a webhook in each, so what they import is scanned in
        within seconds rather than at the next scheduled rescan. API keys are
        never returned.
      operationId: listIntegrations
      responses:
        "200":
          description: Connections, by kind then name
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Integration" } }
    post:
      summary: Connect a Sonarr or Radarr instance and register Cineva's webhook in it (admin)
      description: >
        Checks the URL and API key against the instance's system status (and
        that it is the kind named), then creates a webhook connection there
        called "Cineva", subscribed to imports, upgrades, renames and
        deletions. The instance tests the webhook by calling Cineva back
        before it saves it, so callbackUrl must be Cineva's address as the
        instance reaches it; it defaults to the address this request was
        made to. Nothing is kept when any step fails.
      operationId: createIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationRequest" }
      responses:
        "201":
          description: Connected, with the webhook registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/UpstreamFailed" }

  /integrations/{id}:
    patch:
      summary: Change a connection and register its webhook again (admin)
      description: >
        Blank fields keep their current values. The webhook is registered
        again with a new secret, which also repairs one deleted on the
        instance's side; if the instance refuses, the previous connection and
        webhook are left as they were. When the URL changes, the webhook is
        removed from the old instance where it can still be reached.
      operationId: updateIntegration
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamFailed" }
    delete:
      summary: Disconnect, removing Cineva's webhook from the instance (admin)
      operationId: deleteIntegration
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Disconnected and the webhook removed }
        "200":
          description: >
            Disconnected, but the instance could not be reached to remove the
            webhook. It is left behind and fails Cineva's check from now on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  warning: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /integrations/{id}/webhook:
    post:
      summary: Receive a Sonarr or Radarr webhook event
      description: >
        Called by the instance, not by users: public, authenticated with HTTP
        basic auth as user "cineva" and the connection's secret, which Cineva
        generates when it registers the webhook. Events that add, replace,
        rename or remove files (Download, ImportComplete, Rename,
        SeriesDelete, EpisodeFileDelete, MovieDelete, MovieFileDelete)
        rescan the libraries of the connection's media type that contain the
        event's paths — or all of them, when the instance sees the files at
        different paths (as it does in a container). A rescan requested while
        one is running follows it. Other events, including Test, are
        acknowledged and ignored.
      operationId: integrationWebhook
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Sonarr or Radarr's webhook payload; only the fields below are read.
              properties:
                eventType: { type: string }
                series: { type: object, properties: { path: { type: string } } }
                episodeFile: { type: object, properties: { path: { type: string } } }
                episodeFiles: { type: array, items: { type: object, properties: { path: { type: string } } } }
                movie: { type: object, properties: { folderPath: { type: string } } }
                movieFile: { type: object, properties: { path: { type: string } } }
      responses:
        "200":
          description: Acknowledged; the event does not change files
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "202":
          description: Rescans started or queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Missing or wrong webhook credentials }
        "404": { $ref: "#/components/responses/NotFound" }

  /fs/dirs:
    get:
      summary: List subdirectories of a server path (admin folder picker)
      description: >
        Directories only, one level at a time — never file contents. Hidden
        (dot) directories are omitted unless hidden=1. Symlinked directories
        are followed so linked media mounts are browsable.
      operationId: listDirs
      parameters:
        - { name: path, in: query, required: false, schema: { type: string }, description: Absolute path (default "/") }
        - { name: hidden, in: query, required: false, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  parent: { type: string }
                  dirs:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        path: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Permission denied }
        "404": { $ref: "#/components/responses/NotFound" }

  /stats/system:
    get:
      summary: Host CPU/RAM samples for the admin dashboard
      description: >
        In-memory samples only: range=1h returns every sample from the last
        hour (default 5 s apart); range=24h returns one per minute for the
        last day. Live samples are also pushed on the /events stream as
        "stats" events.
      operationId: systemStats
      parameters:
        - { name: range, in: query, required: false, schema: { type: string, enum: [1h, 24h], default: 1h } }
      responses:
        "200":
          description: Samples, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    at: { type: string, format: date-time }
                    cpuPct: { type: number, description: Whole-host CPU busy, 0–100 }
                    memUsed: { type: integer, description: Bytes (MemTotal − MemAvailable) }
                    memTotal: { type: integer }
                    procRss: { type: integer, description: This server's resident set, bytes }
                    numCpu: { type: integer }

  /stats/plays:
    get:
      summary: Plays per day by media kind
      description: >
        One entry per UTC day for the last `days` days including empty days.
        Every POST /items/{id}/play is recorded; a "plays" event is pushed on
        the /events stream when the history changes.
      operationId: playStats
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, default: 30, maximum: 365 } }
      responses:
        "200":
          description: Days, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date: { type: string, format: date }
                    movies: { type: integer }
                    episodes: { type: integer }
                    tracks: { type: integer }

  /stats/plays/totals:
    get:
      summary: Watch totals for the last `days` days
      description: >
        Aggregates play history: how many plays started, how many reached the
        watched threshold (90% of runtime), and the total wall-clock seconds
        those playbacks were open. Duration is time the playback was open
        rather than playhead movement, so seeking does not inflate or deflate
        it. Rows recorded before the duration columns existed count as a play
        with zero seconds and not completed, which is what was measured for
        them. Separate from /stats/plays because that endpoint returns a bare
        array and response shapes do not change within a version.
      operationId: playTotals
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, default: 30, maximum: 365 } }
      responses:
        "200":
          description: Totals over the window
          content:
            application/json:
              schema:
                type: object
                properties:
                  plays: { type: integer, description: Playbacks started }
                  completed: { type: integer, description: Playbacks that reached 90% of runtime }
                  secs: { type: integer, description: Total wall-clock seconds of playback }

  /playbacks/{userId}/{itemId}:
    delete:
      summary: End a playback (admin)
      description: >
        Ends a playback whether or not it is transcoding, which is how a
        direct play is stopped at all: the server only answers range requests
        for those, so there is no session to kill. The playback is dropped
        from the activity list and marked stopped; the owning client is
        refused on its next POST /items/{id}/progress with 409 and stops
        playing, which takes up to the heartbeat interval (~15 s). A
        transcode session, if present, is torn down immediately. The mark
        expires after 90 seconds, so the viewer can start the item again by
        hand — this ends a stream, it does not revoke access.
      operationId: stopPlaybackAdmin
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Ended }
        "404": { description: No such playback }

  /items/{id}/playback:
    delete:
      summary: Client has stopped playing the item
      description: >
        Drops the item from the active-playback list immediately (and tears
        down its transcode session, if any). Without this, an entry lingers
        until the client misses its progress heartbeats (45 s).
      operationId: stopPlayback
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Stopped }

  /items/{id}/playback/stop:
    post:
      summary: Beacon-friendly alias of DELETE /items/{id}/playback
      description: navigator.sendBeacon can only POST; used on page unload.
      operationId: stopPlaybackBeacon
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Stopped }

  /stats/disks:
    get:
      summary: Disk space on every filesystem backing a library
      description: >
        Library paths on the same filesystem are grouped into one volume.
        freeBytes is what an unprivileged writer could use. Paths that cannot
        be stat'ed are listed last with an error.
      operationId: diskStats
      responses:
        "200":
          description: Volumes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    paths: { type: array, items: { type: string } }
                    libraries: { type: array, items: { type: string } }
                    totalBytes: { type: integer }
                    freeBytes: { type: integer }
                    usedBytes: { type: integer }
                    error: { type: string }

  /logs:
    get:
      summary: Audit trail — who did what, when, from where
      description: >
        Newest first. Actions are dotted verbs (library.create,
        library.delete, scan.start, scan.cancel, scan.completed, scan.failed,
        play.start, download, transcode.stop); `action` filters by prefix.
        Scan completions are recorded by user "system". A "logs" event is
        pushed on /events whenever an entry is added.
      operationId: auditLog
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 100, maximum: 500 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
        - { name: action, in: query, required: false, schema: { type: string }, description: Action prefix filter }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    at: { type: string }
                    userId: { type: string }
                    action: { type: string }
                    targetKind: { type: string }
                    targetId: { type: string }
                    targetTitle: { type: string }
                    detail: { type: string }
                    clientIp: { type: string }
                    client: { type: string, description: "Browser · OS" }

  /scans/{id}/cancel:
    post:
      summary: Cancel a running scan
      description: >
        Scans owned by this server process stop within one file; a stale
        'running' row left by a dead process is marked failed. Starting a
        scan while one is running for the same library is rejected with 409
        (the scans table is the cross-process lock).
      operationId: cancelScan
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Cancellation initiated (or stale row cleared) }
        "409": { description: Scan is not running }

  /items/{id}/play:
    post:
      summary: Start playback — decides direct play vs HLS transcode
      description: >
        The body optionally carries the device's decode capabilities (detected
        client-side) and a quality choice. quality "auto" negotiates (direct
        play when capable, else remux with AAC audio); "original" forces
        direct play; "1080p"/"720p"/"480p" force a video re-encode at that
        level. Starting playback replaces any existing session for the item.
        Music tracks always answer direct play (browsers decode
        flac/mp3/aac/ogg/opus natively); capabilities/quality are ignored for
        them. The music hierarchy (artist -> album -> ordered tracks) is
        served by the same /libraries/{id}/items and /items/{id} endpoints.
      operationId: playItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                containers: { type: array, items: { type: string } }
                videoCodecs: { type: array, items: { type: string } }
                audioCodecs: { type: array, items: { type: string } }
                quality:
                  type: string
                  enum: [auto, original, 1080p, 720p, 480p]
                fromStart:
                  type: boolean
                  description: Ignore the stored resume position and play from 00:00
      responses:
        "200":
          description: How to play the item, including the resume position
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { description: "The library's storage is not reachable, or the file did not answer within 15 s. The message names the library and folder and says what to check." }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{id}/stream:
    get:
      summary: Direct play the original file (supports HTTP range requests)
      operationId: streamItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [original, opus, aac, mp3, ogg] }, description: Music only — stream a cached transcode instead of the file (Opus for bandwidth, AAC as the universal browser fallback) }
        - { name: quality, in: query, required: false, schema: { type: integer, enum: [64, 96, 128, 192, 256, 320] }, description: Bitrate in kbps for transcoded formats (default 192) }
      responses:
        "200": { description: The media file }
        "206": { description: Partial content (range request) }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: "The library's storage is not reachable, or the file did not answer within 15 s. The message names the library and folder and says what to check." }

  /items/{id}/download:
    get:
      summary: Download an item — original file, or a streamed ZIP for containers
      description: >
        Playable items (movie, episode, track) download their original file.
        Container items (season, series, album, artist) stream a stored
        (uncompressed) ZIP of every descendant file, one folder level per
        container ("Season 02/...").
      operationId: downloadItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [original, mp3, ogg] }, description: Music only — transcode tracks (or every track in an album/artist ZIP) }
        - { name: quality, in: query, required: false, schema: { type: integer, enum: [128, 192, 256, 320] }, description: Bitrate in kbps for transcoded formats (default 192) }
      responses:
        "200": { description: The media file or ZIP archive, Content-Disposition attachment }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{id}/watched:
    put:
      summary: Mark an item watched or unwatched by hand
      description: >
        Separate from /progress, which reports the playhead and lets the ~90%
        threshold decide. Progress only ever raises the watched flag, so this
        is the only way to lower it. Both directions clear the resume
        position: marking watched should stop offering a resume, and marking
        unwatched should start from the beginning.
      operationId: setWatched
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [watched]
              properties:
                watched: { type: boolean }
      responses:
        "200": { description: Updated play state, content: { application/json: { schema: { $ref: "#/components/schemas/PlayState" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{id}/progress:
    post:
      summary: Report playback position (crossing ~90% marks the item watched)
      operationId: postProgress
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionSecs]
              properties:
                positionSecs: { type: integer }
                paused: { type: boolean, description: Sent with each heartbeat (every 15 s, even while paused) so the admin Activity page can show state; music positions are not stored as resume state }
      responses:
        "200":
          description: Updated play state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayState" }
        "409":
          description: >
            An administrator ended this playback (see DELETE
            /playbacks/{userId}/{itemId}). The client should stop playing and
            release the stream; the position sent with this request is still
            saved, so resume lands where the viewer got to. Said once — a
            later attempt to play the item again succeeds.

  /items/{id}/next-up:
    get:
      summary: Where to carry on in a series or season
      description: >
        The episode this series or season should play next, for the user
        making the request. Carries on with whatever is part-watched (more
        than 10 seconds in and not finished), otherwise the first episode
        never started, otherwise the first episode again because everything
        is watched. Episodes are ordered by season then number, so the
        pointer crosses season boundaries without the client knowing anything
        about the hierarchy — which is why this lives on the server: the web
        client and the native apps must not disagree about where someone is
        up to. 204 when the item is not a series or season, or has no
        episodes.
      operationId: nextUpFor
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The episode to play
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/Item" }
                  positionSecs: { type: integer, description: Resume position; 0 unless reason is "resume" }
                  reason:
                    type: string
                    enum: [resume, next, restart]
                    description: >
                      Which promise the client's button should make — carry
                      on part-way through, start one never begun, or watch
                      the series again from the beginning.
        "204": { description: Not a series or season, or it has no episodes }

  /items/{id}/next:
    get:
      summary: Server-side next-up decision — the episode after this one
      operationId: nextUp
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The next episode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "204": { description: No next episode (end of series, or not an episode) }

  /items/{id}/prev:
    get:
      summary: The episode before this one (player back button)
      operationId: prevEpisode
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The next episode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "204": { description: No next episode (end of series, or not an episode) }

  /items/{id}/subtitles:
    get:
      summary: List an item's subtitle tracks (embedded and sidecar)
      operationId: itemSubtitles
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Subtitle tracks; text tracks carry a WebVTT url
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubtitleTrack" }

  /subtitles/{id}.vtt:
    get:
      summary: A text subtitle track extracted/converted to WebVTT (cached server-side)
      operationId: subtitleVTT
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: WebVTT content
          content:
            text/vtt: {}
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Image-based track — needs burn-in, not yet available }

  /continue-watching:
    get:
      summary: In-progress items for the home screen, most recent first
      description: Limited to the libraries the viewer may see; at most 20.
      operationId: continueWatching
      responses:
        "200":
          description: Items with resume positions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ResumeItem" }

  /home:
    get:
      summary: Everything the home screen shows, in one request
      description: >
        Limited to the libraries the viewer may see. Continue Watching holds
        one entry per series (its most recently played episode); Next Up is
        the next unstarted episode of each recently watched series that has
        nothing part-watched; shelves are each library's recently added row
        (series ordered by their newest episode for TV) followed by the first
        two recommendation rows of each film and TV library.
      operationId: home
      responses:
        "200":
          description: The home screen's rows
          content:
            application/json:
              schema:
                type: object
                required: [continueWatching, nextUp, shelves]
                properties:
                  continueWatching:
                    type: array
                    items: { $ref: "#/components/schemas/ResumeItem" }
                  nextUp:
                    type: array
                    items: { $ref: "#/components/schemas/ResumeItem" }
                  shelves:
                    type: array
                    items:
                      type: object
                      properties:
                        libraryId: { type: string }
                        libraryName: { type: string }
                        kind: { type: string, description: '"recent", or a recommendation row kind (because, toprated, genre, unwatched)' }
                        title: { type: string }
                        genre: { type: string }
                        items:
                          type: array
                          items: { $ref: "#/components/schemas/Item" }

  /play/sessions:
    get:
      summary: Everything playing right now — direct or transcoded, video or music
      description: >
        One entry per active playback (user + item) with client details
        (IP, browser, OS from the User-Agent), mode/quality, position and
        paused state from the client's heartbeats, and the live transcode
        session when there is one. Entries expire 45 s after the last
        heartbeat. A "sessions" event is pushed on /events on every change.
      operationId: listSessions
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlaySession" }

  /play/{sid}/index.m3u8:
    get:
      summary: HLS VOD playlist for a session
      operationId: hlsPlaylist
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The playlist
          content:
            application/vnd.apple.mpegurl: {}
        "404": { $ref: "#/components/responses/NotFound" }

  /play/{sid}/{file}:
    get:
      summary: HLS session asset (init.mp4 or segNNNNN.m4s); blocks until produced, seeking restarts the transcoder
      operationId: hlsFile
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The segment }
        "404": { $ref: "#/components/responses/NotFound" }
        "504": { description: Segment not produced in time }

  /play/{sid}:
    delete:
      summary: Stop a playback session and delete its temp files
      operationId: stopSession
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Stopped }

components:
  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, user] }
        disabled: { type: boolean }
        hasPassword: { type: boolean }
        hasPin: { type: boolean }
        createdAt: { type: string }
        libraryIds:
          type: array
          items: { type: string }
          description: >
            Every library this user can see, computed: the open libraries,
            plus restricted ones that name the user or a group they belong
            to; every library for an admin. Read-only — access is set per
            library (PUT /libraries/{id}/access).
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, minLength: 8 }
        displayName: { type: string }
    Integration:
      type: object
      required: [id, kind, name, url, callbackUrl, notificationId, version]
      properties:
        id: { type: string }
        kind: { type: string, enum: [sonarr, radarr] }
        name: { type: string }
        url: { type: string, description: The instance's base URL }
        callbackUrl: { type: string, description: Cineva's address as the instance reaches it }
        notificationId: { type: integer, description: The webhook's id inside the instance; 0 if not registered }
        version: { type: string, description: The instance's version when the connection was last saved }
        createdAt: { type: string }
        updatedAt: { type: string }
    IntegrationRequest:
      type: object
      description: On create, kind, url and apiKey are required. On update, kind is ignored and blank fields keep their values.
      properties:
        kind: { type: string, enum: [sonarr, radarr] }
        name: { type: string, description: Defaults to "Sonarr" or "Radarr" }
        url: { type: string }
        apiKey: { type: string, writeOnly: true }
        callbackUrl: { type: string }
    WebhookResult:
      type: object
      properties:
        event: { type: string }
        rescanning: { type: array, items: { type: string }, description: Names of the libraries rescanning }
    UserGroup:
      type: object
      required: [id, name, memberIds]
      properties:
        id: { type: string }
        name: { type: string }
        memberIds: { type: array, items: { type: string } }
        createdAt: { type: string }
    UserGroupRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        memberIds: { type: array, items: { type: string } }
    LibraryAccess:
      type: object
      required: [restricted, userIds, groupIds]
      properties:
        restricted: { type: boolean, description: "False: every user sees the library, and the lists are ignored" }
        userIds: { type: array, items: { type: string } }
        groupIds: { type: array, items: { type: string } }
    UserRequest:
      type: object
      properties:
        username: { type: string, description: Create only }
        displayName: { type: string }
        password: { type: string, minLength: 8, description: On create, required unless a PIN is given (admins always); on update, resets it }
        role: { type: string, enum: [admin, user] }
        disabled: { type: boolean }
        pin: { type: string, description: "Quick sign-in PIN (4–6 digits); on update, empty string removes it. A regular user may be PIN-only (no password); admins must have a password." }
    Settings:
      type: object
      properties:
        detectionRateMB:
          type: integer
          enum: [0, 50, 25, 10]
          description: >
            Cap on how fast intro and credits detection reads media, in MB/s;
            0 is no cap. With a cap, files are read one at a time. Detection
            also always pauses while anything plays or a scan runs.
        detectionRateOptions:
          type: array
          items: { type: integer }
          description: Read-only; the caps offered.
        loginMode:
          type: string
          enum: [picker, form]
          description: picker = every user as a tile, then their PIN or password; form = username + password-or-PIN box. Default from auth.login_mode.
        hwAccel:
          type: boolean
          description: >
            Whether new transcode sessions may use the GPU. Default true;
            with no usable device the server transcodes on the CPU regardless.
            Takes effect on the next session, not on sessions already running.
        hwAccelStatus:
          type: string
          readOnly: true
          description: >
            The backend detected at startup, for display beside the switch —
            e.g. "vaapi (/dev/dri/renderD128)", "nvenc", or "none" when the
            host has no usable hardware transcoder.
        certRegion:
          type: string
          description: >
            ISO 3166-1 country whose content rating is stored and shown.
            Certifications are issued per country by different boards, so a
            BBFC "15" and an FSK "16" are different judgements rather than two
            spellings of one value. Falls back to the US rating where a title
            is unclassified in the chosen region. Default from
            metadata.cert_region (GB). Applies to titles scanned or refreshed
            afterwards; existing rows keep the rating they were given.
          example: GB
        certRegions:
          type: array
          readOnly: true
          items: { type: string }
          description: The regions this server offers, for the admin picker.
    APIKey:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
        createdAt: { type: string }
        lastUsedAt: { type: string }
    MediaType:
      type: string
      enum: [movies, tv, music, audiobooks, podcasts, books]

    Collection:
      type: object
      description: >
        A set of films grouped by the metadata provider — "The Matrix
        Collection", "Harry Potter Collection".
      properties:
        id: { type: integer, description: Provider collection id }
        name: { type: string }
        count: { type: integer, description: How many of the set this library holds }
        poster:
          type: string
          description: >
            Artwork standing in for the set — the earliest film's poster, so
            the row is recognisable rather than arbitrary.

    Theme:
      type: object
      properties:
        id: { type: string, description: "Folder name; stylesheet at /themes/{id}/theme.css" }
        name: { type: string }
        appearance: { type: string, enum: [dark, light] }

    Library:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mediaType: { $ref: "#/components/schemas/MediaType" }
        source: { type: string, enum: [local, federated] }
        paths:
          type: array
          items: { type: string }
        itemCount: { type: integer, description: Playable items (movies + episodes) }
        createdAt: { type: string }
        updatedAt: { type: string }
        restricted: { type: boolean, description: "Seen only by the users and groups in its access (GET /libraries/{id}/access); otherwise open to everyone" }
        storage:
          type: object
          description: >
            Whether the library's folders can be reached, from a check every
            30 s. While unavailable, play and stream for its items fail at
            once with 503, scans fail, and intro detection skips it.
          properties:
            available: { type: boolean }
            since: { type: string, format: date-time, description: When it last changed }
            path: { type: string, description: The folder that failed }
            error: { type: string, description: 'How it failed, e.g. "not responding", "host is down"' }

    Item:
      type: object
      properties:
        id: { type: string, format: uuid }
        libraryId: { type: string, format: uuid }
        kind: { type: string, enum: [movie, series, season, episode, artist, album, track] }
        parentId: { type: string }
        title: { type: string }
        year: { type: integer }
        seasonNum: { type: integer }
        episodeNum: { type: integer }
        discNum: { type: integer }
        trackNum: { type: integer }
        artist: { type: string, description: Display artist (music kinds) }
        path: { type: string }
        sizeBytes: { type: integer, format: int64 }
        runtimeSecs: { type: integer }
        container: { type: string }
        videoCodec: { type: string }
        audioCodec: { type: string }
        width: { type: integer }
        height: { type: integer }
        tmdbId: { type: integer }
        overview: { type: string }
        poster: { type: string, description: Server-relative artwork URL (/artwork/...) }
        addedAt: { type: string }
        updatedAt: { type: string }
        versionOf:
          type: string
          description: >
            Id of the item this is an alternative version of — the same film
            at a different quality. Empty for a primary, which is what the
            library grid lists.
        rating: { type: number, format: double, description: Provider score, 0-10 }
        voteCount: { type: integer }
        certification:
          type: string
          description: >
            Content rating for the server's configured region ("15",
            "PG-13"). Free text: the scale is per-country, since each board
            classifies separately. See Settings.certRegion.
        tagline: { type: string }
        backdrop: { type: string, description: Server-relative wide artwork URL }
        collectionId: { type: integer }
        collectionName: { type: string, description: e.g. "The Matrix Collection" }
        genres:
          type: array
          items: { type: string }
          description: Filled by the endpoints that need it, not by every item query.
        watched:
          type: boolean
          description: >
            The requesting user's own state, stamped on by the library
            listing and on a season's episodes in item detail. Shared across a film's versions: it is recorded against
            the primary.
        positionSecs:
          type: integer
          description: The requesting user's resume position, as for watched.

    PlayInfo:
      type: object
      properties:
        mode: { type: string, enum: [direct, hls] }
        url: { type: string }
        sessionId: { type: string }
        durationSecs: { type: integer }
        positionSecs: { type: integer, description: Resume point }
        reason: { type: string, description: Why transcoding was chosen }
        subtitles:
          type: array
          items: { $ref: "#/components/schemas/SubtitleTrack" }
        audio:
          type: array
          description: The file's audio streams, for the player's track picker.
          items: { $ref: "#/components/schemas/AudioTrack" }
        audioTrack:
          type: integer
          description: >
            Stream index actually being played — the file's default unless
            the request asked for another. -1 when the file has no audio.
        segments:
          type: array
          description: >
            Parts of the episode found by detection: an intro the player
            offers to skip, and end credits, where the up-next card appears
            and autoplay counts down. Reaching the credits also marks the
            episode watched. Absent until something has been found.
          items: { $ref: "#/components/schemas/Segment" }
        source:
          $ref: "#/components/schemas/PlaySource"

    ResumeItem:
      description: An item with the viewer's resume position; an episode also carries its series.
      allOf:
        - { $ref: "#/components/schemas/Item" }
        - type: object
          properties:
            positionSecs: { type: integer }
            seriesId: { type: string }
            seriesTitle: { type: string, description: "An episode's series; absent for anything else" }
            seriesPoster: { type: string }
            seriesBackdrop: { type: string }

    Segment:
      type: object
      description: A part of an item that is not the item itself, in seconds from the start of the file.
      required: [kind, startSecs, endSecs]
      properties:
        kind: { type: string, enum: [intro, credits] }
        startSecs: { type: number }
        endSecs: { type: number }

    AudioTrack:
      type: object
      description: One embedded audio stream — another language, a commentary, or a different mix.
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        streamIndex: { type: integer }
        codec: { type: string }
        language: { type: string, description: ISO 639-2 code as the file carries it }
        title: { type: string }
        channels: { type: integer, description: 2 = stereo, 6 = 5.1, 8 = 7.1 }
        bitRate: { type: integer }
        default: { type: boolean, description: The track the file marks as default }

    PlaySource:
      type: object
      description: >
        What the viewer is actually being sent, so the player's info panel can
        show it rather than leaving them to guess why a 4K title looks soft.
      properties:
        container: { type: string }
        videoCodec: { type: string }
        width: { type: integer }
        height: { type: integer }
        hdrFormat: { type: string, enum: [pq, hlg], description: Transfer characteristic when the source is HDR }
        dvProfile: { type: integer, description: Dolby Vision profile, absent when the stream carries none }
        video:
          type: string
          enum: [direct, remux, transcode]
          description: direct = untouched file; remux = video copied bit-for-bit, container changed; transcode = re-encoded.
        outHeight: { type: integer, description: Height being sent; absent when the video is untouched }
        audio: { type: string, enum: [direct, transcode] }
        audioCodec: { type: string, description: Codec being sent }

    SubtitleTrack:
      type: object
      properties:
        id: { type: string, format: uuid }
        language: { type: string }
        title: { type: string }
        codec: { type: string, description: subrip/ass/mov_text/vtt (text) or hdmv_pgs_subtitle/dvd_subtitle (image) }
        forced: { type: boolean }
        url: { type: string, description: WebVTT url; absent for image-based tracks }

    Person:
      type: object
      description: Someone credited on an item.
      properties:
        id: { type: string, format: uuid }
        tmdbId: { type: integer }
        name: { type: string }
        profile: { type: string, description: /artwork/... headshot }
        role: { type: string, description: Character for cast, job for crew }
        kind: { type: string, enum: [cast, crew] }

    MatchCandidate:
      type: object
      properties:
        tmdbId: { type: integer }
        title: { type: string }
        year: { type: integer }
        overview: { type: string }
        poster: { type: string, description: Absolute TMDB image URL }

    PlayState:
      type: object
      properties:
        itemId: { type: string, format: uuid }
        positionSecs: { type: integer, description: Resume position; 0 once watched or explicitly unwatched }
        watched: { type: boolean }
        updatedAt: { type: string }

    PlaySession:
      type: object
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        title: { type: string }
        segmentSecs: { type: integer }
        numSegments: { type: integer }
        accel:
          type: string
          description: >
            The transcode path this session was built with — a backend name
            such as "vaapi (/dev/dri/renderD128)", or "none" for software.
            Fixed for the life of the session even if the admin switch moves.

    Scan:
      type: object
      properties:
        id: { type: string, format: uuid }
        libraryId: { type: string, format: uuid }
        status: { type: string, enum: [running, completed, failed] }
        filesSeen: { type: integer }
        itemsCreated: { type: integer }
        error: { type: string }
        startedAt: { type: string }
        finishedAt: { type: string }

  responses:
    UpstreamFailed:
      description: Sonarr or Radarr could not be reached, refused the API key, or refused the webhook (its own message is passed on)
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }

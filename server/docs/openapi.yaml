openapi: "3.1.0"
info:
  title: Cineva API
  description: >
    Self-hosted media suite API. This spec is the contract: it is updated in
    the same change as the handlers it describes.
  version: 0.1.0
servers:
  - url: /api/v1

# Signed in by default: a browser's session cookie, or an API key (created
# under Account settings) sent as a bearer token or in X-Api-Key. Operations
# open to everyone say so with an empty security list.
security:
  - sessionCookie: []
  - bearerKey: []
  - apiKeyHeader: []

tags:
  - name: Account
    description: "Signing in, your profile, preferences, picture and API keys"
  - name: Devices
    description: "Your signed-in browsers: list, name, sign out, and hand play queues between them"
  - name: Browse
    description: "Home screen rows, search and people"
  - name: Libraries
    description: "Libraries and their contents"
  - name: Collections
    description: "Film collections, from the metadata provider or made by an admin"
  - name: Items
    description: "Films, series, seasons, episodes and music"
  - name: Playback
    description: "Playing, streaming, downloading, subtitles and watch state"
  - name: Music
    description: "Artist pages, listening history and playlists"
  - name: Users
    description: "Accounts and groups (admin)"
  - name: Integrations
    description: "Sonarr and Radarr"
  - name: Home Assistant
    description: "Rooms, controls, cameras and modes, through the household's Home Assistant"
  - name: Requests
    description: "Finding titles outside the library on TMDB, asking for them, the admin's queue, and what a series is missing"
  - name: Administration
    description: "Scans, metadata, settings, statistics and logs (admin)"
  - name: System
    description: "Health, themes, the live event stream and this specification"

paths:
  /openapi.yaml:
    get:
      summary: This API's specification (public)
      description: >
        The document you are reading, as OpenAPI 3.1 YAML — for generating
        client SDKs. /api/docs renders it as an interactive reference.
      operationId: getOpenAPI
      tags: [System]
      security: []
      responses:
        "200":
          description: The specification
          content:
            application/yaml:
              schema: { type: string }
  /health:
    get:
      summary: Liveness check
      operationId: getHealth
      tags: [System]
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  service: { type: string }
                  version: { type: string }

  /themes:
    get:
      summary: List UI themes
      operationId: listThemes
      tags: [System]
      security: []
      responses:
        "200":
          description: Available themes (folders under /themes)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Theme" }

  # ---- Authentication & users (milestone 4) ----
  # Every endpoint except /health, /themes, /auth/status, /auth/login and
  # /auth/setup requires a signed-in caller: the cineva_session cookie
  # (browsers) or an API key via `Authorization: Bearer cnv_…` /
  # `X-Api-Key` (clients). Admin-only endpoints answer 403 to regular
  # users. Library-scoped endpoints answer 404 for libraries the caller
  # has not been granted; admins see every library.
  /auth/status:
    get:
      summary: Setup state and the caller's identity (public)
      description: >
        On a device an admin has set to sign in by itself (PATCH
        /devices/{id}, autoUserId), a browser nobody is signed in on is
        signed in here as that user, as the client opens. This is the only
        place it happens, so a device never changes person in the middle of
        anything.
      operationId: authStatus
      tags: [Account]
      security: []
      responses:
        "200":
          description: setupRequired is true until the first admin exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  setupRequired: { type: boolean }
                  loginMode: { type: string, enum: [picker, form], description: What the sign-in screen shows (admin setting) }
                  user: { $ref: "#/components/schemas/User" }
                  autoUser:
                    type: object
                    description: Who this device signs in as when nobody is signed in on it, for "Back to ..." on the profile picker
                    properties:
                      id: { type: string }
                      displayName: { type: string }
  /auth/setup:
    post:
      summary: Create the first admin (public; 409 once any user exists)
      operationId: authSetup
      tags: [Account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201": { description: Admin created and signed in, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Setup already completed }
  /auth/login:
    post:
      summary: Sign in (sets the session cookie)
      description: The password field also accepts the user's PIN, when they have one.
      operationId: authLogin
      tags: [Account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { description: Incorrect username or password (or account disabled) }
  /auth/profiles:
    get:
      summary: Sign-in profile picker (public)
      description: >
        Every enabled user, for the "Who's watching?" tiles. Empty when the
        sign-in screen is in form mode, so no names are revealed then.
      operationId: authProfiles
      tags: [Account]
      security: []
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    username: { type: string }
                    displayName: { type: string }
                    hasPassword: { type: boolean, description: The user may switch to password sign-in }
                    hasPin: { type: boolean, description: Ask for a PIN; otherwise ask for the password }
                    avatar: { type: string, description: The user's picture (an /artwork/ path), when they have one }
                    avatarColour: { type: string, description: The theme token their initial is drawn on, when they chose one }
  /auth/pin:
    post:
      summary: Quick sign-in with a PIN (public)
      description: >
        Five wrong PINs lock that user's PIN sign-in for 30 s, doubling per
        further failure up to 15 minutes (429 with Retry-After). Password
        sign-in is throttled the same way per username.
      operationId: authPINLogin
      tags: [Account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, pin]
              properties:
                userId: { type: string }
                pin: { type: string, pattern: "^[0-9]{4,6}$" }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { description: Incorrect PIN }
        "429": { description: Locked out — see Retry-After }
  /auth/pin/set:
    post:
      summary: Set or remove own quick sign-in PIN
      description: >
        Requires the current password (or, for PIN-only accounts, the
        current PIN) in `password`. pin "" removes the PIN, which is refused
        for accounts that have no password.
      operationId: authSetPIN
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, pin]
              properties:
                password: { type: string }
                pin: { type: string, description: "4–6 digits, or empty to remove" }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Current password/PIN incorrect }

  /auth/logout:
    post:
      summary: Sign out this session
      operationId: authLogout
      tags: [Account]
      responses:
        "204": { description: Signed out }
  /auth/me:
    get:
      summary: The signed-in user
      operationId: authMe
      tags: [Account]
      responses:
        "200": { description: User, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
    patch:
      summary: Change your own display name
      description: >
        The name shown on the profile picker and in the top bar. The
        username, which signs in, does not change; role and library access
        stay with an admin.
      operationId: updateMe
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 40, description: Trimmed; at most 40 characters }
      responses:
        "200": { description: The user as changed, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { description: Empty or too long }
  /auth/password:
    post:
      summary: Change own password (other sessions are signed out)
      operationId: authPassword
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, new]
              properties:
                current: { type: string }
                new: { type: string, minLength: 8 }
      responses:
        "204": { description: Changed }
        "403": { description: Current password incorrect }
  /auth/prefs:
    get:
      summary: Your own layer of preferences, as stored
      description: >
        The values you have set yourself, without your administrator's
        defaults or locks and without any device's own values. Kept for
        clients written before preferences had layers: GET /auth/me/prefs is
        the resolved view, with the registry that says what each key means.
      operationId: getPrefs
      tags: [Account]
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: string } }
    put:
      summary: Change some of your own stored preferences
      description: >
        Merged into what is stored: only the keys sent change, and an empty
        value removes one. At most 50 keys, keys up to 64 characters and
        values up to 512. Written as sent: an administrator's lock still wins
        when the value is resolved, and a value that does not suit its key is
        ignored there. PUT /auth/me/prefs checks both and says so.
      operationId: putPrefs
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: { type: string } }
      responses:
        "200":
          description: All your preferences, after the change
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /auth/me/prefs:
    get:
      summary: Your preferences as they apply to you
      description: >
        Every preference's value on this device, the layer it came from and
        whether your administrator has locked it, with the registry of
        preferences the server knows, so a client can draw its Settings page
        without hardcoding the keys. A value resolves through this device's
        own value (device preferences only), then yours, then your groups'
        defaults in the administrator's order, then the server's default,
        then the built-in one; a lock at a group or the server wins over you
        and your device. Keys the registry does not know are returned from
        your own layer as they are.
      operationId: getMyPrefs
      tags: [Account]
      parameters:
        - name: device
          in: query
          description: Resolve for another of your devices (a session id) rather than this one
          schema: { type: string }
      responses:
        "200":
          description: Resolved preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyPrefs" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Set your own preferences
      description: >
        A string sets a key (an empty string is a value: "the file's own
        audio track"); null clears it, handing it back to the default. A
        registered key must suit its type. Keys the registry does not know
        are stored as they are, within the same limits as /auth/prefs.
        Setting a key your administrator has locked is a 409 naming the lock.
      operationId: putMyPrefs
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: { type: [string, "null"] } }
      responses:
        "200":
          description: Your preferences, resolved after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyPrefs" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/PrefLocked" }
  /auth/keys:
    get:
      summary: List own API keys
      operationId: listAPIKeys
      tags: [Account]
      responses:
        "200": { description: Keys (never the secret), content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/APIKey" } } } } }
    post:
      summary: Create an API key — the secret is returned exactly once
      operationId: createAPIKey
      tags: [Account]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string } } }
      responses:
        "201":
          description: Key created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIKey"
                  - type: object
                    properties:
                      key: { type: string, description: "Bearer secret, prefixed cnv_; shown only here" }
  /auth/keys/{id}:
    delete:
      summary: Revoke an API key
      operationId: deleteAPIKey
      tags: [Account]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/avatar:
    post:
      summary: Upload your own picture
      description: >
        A JPEG, PNG, GIF or WebP of at most 15 MB, as the multipart field
        "image". It is turned upright by its EXIF orientation, cropped to its
        centre square and stored as a 256-pixel JPEG under /artwork/, which
        is served without sign-in so the profile picker can show it.
      operationId: uploadOwnAvatar
      tags: [Account]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        "200": { description: The updated user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      summary: Remove your own picture, going back to your initial
      operationId: deleteOwnAvatar
      tags: [Account]
      responses:
        "200": { description: The updated user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /auth/avatar/colour:
    put:
      summary: Choose the colour behind your initial
      operationId: setOwnAvatarColour
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [colour]
              properties:
                colour: { $ref: "#/components/schemas/AvatarColour" }
      responses:
        "200": { description: The updated user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /auth/sessions:
    get:
      summary: Your signed-in devices
      description: >
        Each browser sign-in is a device. Listed most recently active first,
        marking this one (current) and those with the app open right now
        (online — the ones a queue can be sent to). A device's play queue is
        summarised so another can take it over.
      operationId: listDevices
      tags: [Devices]
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Device" } }
  /auth/sessions/current:
    patch:
      summary: Name this device ("Living-room TV"), or put it in a room
      description: >
        Only for a browser session; a request made with an API key belongs
        to no device (400). Fields left out are kept.
      operationId: nameDevice
      tags: [Devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 40, description: Empty to go back to the browser's name }
                areaId: { type: string, description: 'The Home Assistant area this device is in; "" for none' }
      responses:
        "204": { description: Named }
        "400": { $ref: "#/components/responses/BadRequest" }
  /auth/sessions/current/queue:
    put:
      summary: Record this device's play queue, so another device can take it over
      description: >
        Positions are not part of it: resume positions are kept per user and
        item, so whichever device plays next resumes where the last stopped.
        An empty list clears it.
      operationId: saveDeviceQueue
      tags: [Devices]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueueRequest" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/BadRequest" }
  /auth/sessions/revoke-others:
    post:
      summary: Sign out every device but this one
      operationId: revokeOtherDevices
      tags: [Devices]
      responses:
        "200":
          description: How many devices were signed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
  /auth/sessions/{id}:
    delete:
      summary: Sign one of your other devices out, or forget a device
      description: >
        It is signed out at once: its event stream receives "revoked" and
        closes, and its next request is refused. The device itself stays
        known, with its name, room and preferences (see docs/devices.md).
        This device is signed out with POST /auth/logout instead (400
        here). With forget=true the device is removed altogether, this one
        included.
      operationId: revokeDevice
      tags: [Devices]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: forget, in: query, required: false, schema: { type: boolean }, description: Remove the device, not just sign it out }
      responses:
        "204": { description: Signed out }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/sessions/{id}/queue:
    get:
      summary: Another device's play queue, to take over
      description: >
        Its items as they stand now: any the caller may no longer see, or a
        rescan has removed, are left out, with index kept on the same item.
        Each carries the caller's watch state.
      operationId: deviceQueue
      tags: [Devices]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The queue, content: { application/json: { schema: { $ref: "#/components/schemas/HandoffQueue" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/sessions/{id}/play:
    post:
      summary: Send a queue to another of your devices, which starts playing it
      description: >
        The device must be online — have the app open — or this answers 409.
        It receives a "handoff" event (see /events) with the items it may
        play resolved, and begins at index, resuming from the caller's saved
        position. The sending client stops its own playback when this
        succeeds.
      operationId: playOnDevice
      tags: [Devices]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueueRequest" }
      responses:
        "202": { description: Sent }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The device is not connected }
  /auth/sessions/{id}/prefs:
    get:
      summary: One of your devices' own preferences
      description: >
        The values set on that device alone (`current` for this one), before
        resolution. Only device preferences, such as video quality, are kept
        per device.
      operationId: getDevicePrefs
      tags: [Devices]
      parameters:
        - { name: id, in: path, required: true, description: "A session id, or current", schema: { type: string } }
      responses:
        "200":
          description: The device's values
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Set preferences on one of your devices
      description: >
        Only keys the registry marks as device preferences belong here. A
        string sets a key; null clears it, so the device follows your own
        value again. Setting a key your administrator has locked is a 409.
      operationId: putDevicePrefs
      tags: [Devices]
      parameters:
        - { name: id, in: path, required: true, description: "A session id, or current", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: { type: [string, "null"] } }
      responses:
        "200":
          description: Your preferences, resolved for that device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyPrefs" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PrefLocked" }
  /settings:
    get:
      summary: Runtime settings (admin)
      operationId: getSettings
      tags: [Administration]
      responses:
        "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
    put:
      summary: Change runtime settings (admin) — only the fields sent change
      operationId: putSettings
      tags: [Administration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200": { description: Updated settings, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /users:
    get:
      summary: List users (admin)
      operationId: listUsers
      tags: [Users]
      responses:
        "200": { description: Users, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
        "403": { description: Admin only }
    post:
      summary: Create a user (admin)
      operationId: createUser
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /users/{id}/avatar:
    post:
      summary: Set a user's picture (admin)
      description: As POST /auth/avatar, for any user.
      operationId: uploadUserAvatar
      tags: [Users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        "200": { description: The updated user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Remove a user's picture (admin)
      operationId: deleteUserAvatar
      tags: [Users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The updated user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{id}/sessions:
    get:
      summary: A user's signed-in devices (admin)
      operationId: userDevices
      tags: [Users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Device" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /devices:
    get:
      summary: Every device, signed in on or not (admin)
      description: >
        A device is a screen: a browser, later a native app. It outlives
        the sessions signed in on it and holds one at a time.
      operationId: listAllDevices
      tags: [Devices]
      responses:
        "200":
          description: Devices, most recently seen first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminDevice" } }
  /devices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Name a device, set its room, or have it sign in by itself (admin)
      description: >
        Fields left out are kept. autoUserId makes the device sign in as
        that user whenever nobody is signed in on it, with the profile
        picker still there to switch; "" turns it off. An admin account is
        refused: whoever is in front of the device would have the admin
        pages. On such a device the device cookie signs someone in, so it
        is as sensitive as a remembered sign-in.
      operationId: updateDevice
      tags: [Devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 40 }
                areaId: { type: string, description: 'A Home Assistant area; "" for none' }
                autoUserId: { type: string, description: 'Who it signs in as; "" for nobody' }
      responses:
        "200": { description: The device, content: { application/json: { schema: { $ref: "#/components/schemas/AdminDevice" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Forget a device (admin)
      description: Its name, room and preferences go, and whoever is signed in on it is signed out.
      operationId: forgetDevice
      tags: [Devices]
      responses:
        "204": { description: Forgotten }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{id}/sessions/{sid}:
    delete:
      summary: Sign one of a user's devices out, or forget it (admin)
      operationId: revokeUserDevice
      tags: [Users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: sid, in: path, required: true, schema: { type: string } }
        - { name: forget, in: query, required: false, schema: { type: boolean }, description: Remove the device, not just sign it out }
      responses:
        "204": { description: Signed out }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Update a user — display name, role, disabled, library grants, optional password reset (admin)
      description: Resetting the password or disabling signs the user out everywhere. Admins cannot demote, disable or delete themselves.
      operationId: updateUser
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRequest" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a user and everything of theirs (admin)
      operationId: deleteUser
      tags: [Users]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups:
    get:
      summary: List user groups (admin)
      description: >
        Named sets of this server's users ("Kids", "Grown-ups"), for
        restricting libraries without listing every account and for setting
        preference defaults. Listed in priority order: where groups' defaults
        conflict, the first wins.
      operationId: listGroups
      tags: [Users]
      responses:
        "200":
          description: Groups, in priority order
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/UserGroup" } }
    post:
      summary: Create a group (admin)
      operationId: createGroup
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserGroupRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserGroup" }
        "400": { description: Missing or duplicate name, or an unknown member }

  /groups/{id}:
    put:
      summary: Rename a group and replace its members (admin)
      operationId: updateGroup
      tags: [Users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserGroupRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserGroup" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a group (admin); it is also removed from every library's access list
      operationId: deleteGroup
      tags: [Users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/order:
    put:
      summary: Order the groups by priority (admin)
      description: >
        Where a user is in several groups that set the same preference, the
        first group in this order wins: "Kids" above "Grown-ups" for a child
        in both. The list must name every group exactly once.
      operationId: setGroupOrder
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupIds]
              properties:
                groupIds: { type: array, items: { type: string } }
      responses:
        "200":
          description: Every group, in the new order
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/UserGroup" } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /groups/{id}/prefs:
    get:
      summary: A group's preference defaults (admin)
      operationId: getGroupPrefs
      tags: [Users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The group's defaults, by key
          content:
            application/json:
              schema: { type: object, additionalProperties: { $ref: "#/components/schemas/PrefSetting" } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Set a group's preference defaults (admin)
      description: >
        Merged into the group's defaults: a setting sets a key, null clears
        it. Only registered keys can have a default, a value must suit its
        type, and only a lockable key can be locked. A locked default applies
        to the group's members whatever they choose.
      operationId: putGroupPrefs
      tags: [Users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrefDefaultsRequest" }
      responses:
        "200":
          description: The group's defaults after the change
          content:
            application/json:
              schema: { type: object, additionalProperties: { $ref: "#/components/schemas/PrefSetting" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /prefs/defaults:
    get:
      summary: Every preference default (admin)
      description: >
        The registry, the server's defaults and every group's, groups in
        priority order: everything the Defaults table in the admin UI draws.
      operationId: getPrefDefaults
      tags: [Administration]
      responses:
        "200":
          description: Defaults
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrefDefaults" }
    put:
      summary: Set the server's preference defaults (admin)
      description: >
        Merged into the server's defaults, which apply to every user who has
        not chosen otherwise and whose groups set nothing. A setting sets a
        key, null clears it; a locked default applies to everyone.
      operationId: putPrefDefaults
      tags: [Administration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrefDefaultsRequest" }
      responses:
        "200":
          description: Every default after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrefDefaults" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /libraries/{id}/access:
    get:
      summary: Who may see a library (admin)
      operationId: getLibraryAccess
      tags: [Administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The library's access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryAccess" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Set who may see a library (admin)
      description: >
        Libraries are open to every user by default. Restricting one limits
        it to the users and groups listed (admins always see everything); a
        restricted library with empty lists is admin-only. The lists are kept
        when a library is reopened, so restricting it again restores them.
      operationId: setLibraryAccess
      tags: [Administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryAccess" }
      responses:
        "200":
          description: The access now in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryAccess" }
        "400": { description: An unknown user or group }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries:
    get:
      summary: List libraries
      operationId: listLibraries
      tags: [Libraries]
      responses:
        "200":
          description: All libraries with playable-item counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Library" }
    post:
      summary: Create a library
      description: >
        A library has exactly one media type, chosen at creation and immutable
        afterwards. Multiple libraries per type are allowed; a library never
        spans types.
      operationId: createLibrary
      tags: [Libraries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mediaType, paths]
              properties:
                name: { type: string }
                mediaType: { $ref: "#/components/schemas/MediaType" }
                paths:
                  type: array
                  items: { type: string }
                  minItems: 1
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /libraries/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a library
      operationId: getLibrary
      tags: [Libraries]
      responses:
        "200":
          description: The library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Rename a library or change its folders (admin)
      description: >
        Only the fields sent change. The media type cannot: everything already
        scanned keys off it, so a library of the wrong type is deleted and
        made again. A removed folder's items are pruned by the next scan.
      operationId: updateLibrary
      tags: [Libraries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                paths: { type: array, items: { type: string } }
      responses:
        "200": { description: The updated library, content: { application/json: { schema: { $ref: "#/components/schemas/Library" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a library and its scanned items (files on disk untouched)
      operationId: deleteLibrary
      tags: [Libraries]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries/{id}/segments/redetect:
    post:
      summary: Detect a whole library's intros and credits again (admin)
      description: >
        Every episode and film of a film or TV library, except times set by
        hand unless includeLocked is true. It goes through the library
        queue rather than ahead of it, starting straight away whatever the
        schedule says, as POST /segments/run does; it still gives way to
        playback, scans and a manual pause. 409 when detection is turned
        off.
      operationId: redetectLibrary
      tags: [Administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/RedetectKinds"
        - $ref: "#/components/parameters/RedetectIncludeLocked"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedetectRequest" }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/RedetectResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Intro detection is turned off }
  /libraries/{id}/scan:
    post:
      summary: Start a background scan of the library
      description: >
        Incremental by default: a file whose size and modification time match
        what the last scan recorded, and whose sidecars (.nfo, local artwork,
        external subtitles) have not changed either, is skipped, and only new
        or changed files are read and matched. Films and series still
        unmatched are looked up again once a day at most, less often after
        repeated failures. Items whose files have gone are removed either
        way. Pass full=true to reread and rematch everything, which picks up
        new provider data and recovers from a bad match.
      operationId: scanLibrary
      tags: [Libraries]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: full
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Reread and rematch every file instead of only changed ones
      responses:
        "202":
          description: Scan started; poll /scans for progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scan" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: A scan for this library is already running }

  /libraries/{id}/scan/queued:
    put:
      summary: Queue a full rescan for a quiet time
      description: >
        A full rescan rereads and rematches every file, which on a large
        library is hours of reading from the storage playback uses. Queued
        instead of started, it begins in the background work window (the
        intro-detection schedule), once nothing is playing and no other scan
        is running, and not while background work is paused; with the
        on-demand schedule it waits only for playback to stop. The queue
        survives a restart. Queuing a library already queued changes nothing.
      operationId: queueFullScan
      tags: [Libraries]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Queued }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Take a queued full rescan off the queue
      operationId: cancelQueuedFullScan
      tags: [Libraries]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: No longer queued }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries/{id}/items:
    get:
      summary: List all items in a library
      operationId: libraryItems
      tags: [Libraries]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Items, all kinds (movie, series, season, episode)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }

  /libraries/{id}/manage:
    get:
      summary: One page of a library's items for the Manage list (admin)
      description: >
        The same items as /libraries/{id}/items — every kind, alternative
        versions left out, ordered by kind then title — but filtered and paged
        on the server, so a library of tens of thousands of items is fetched a
        page at a time. total counts the items matching the filter across
        every page; matched and all describe the whole library regardless of
        the filter.
      operationId: libraryManage
      tags: [Administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring of the title or the file path
        - name: unmatched
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Only items with no TMDB match
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
          description: 1-based page number; a page past the end returns no items
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
          description: Items per page, clamped to 1–500
      responses:
        "200":
          description: The page, with its counts
          content:
            application/json:
              schema:
                type: object
                required: [items, total, matched, all, page, size]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
                  total: { type: integer, description: Items matching the filter, across every page }
                  matched: { type: integer, description: Items in the library matched to TMDB }
                  all: { type: integer, description: Items in the library }
                  page: { type: integer, description: The page returned }
                  size: { type: integer, description: The page size applied after clamping }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{id}/artist:
    get:
      summary: An artist's page
      description: >
        The artist with their own albums oldest first, other artists' albums
        they appear on (compilations, soundtracks, duets), their top tracks
        ranked by the viewer's plays and then the household's (tracks nobody
        has played are left out), and counts. The artist's poster and
        overview are a picture and biography found through MusicBrainz,
        Wikidata and Wikipedia; opening the page starts that lookup when it
        is due (never done, or something missing after 30 days), and
        lookingUp says so — an "items" event follows when it finishes.
      operationId: getArtist
      tags: [Music]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The artist page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtistPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{id}:
    get:
      summary: Get an item with its direct children
      operationId: getItem
      tags: [Items]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Item detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/Item" }
                  children:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Edit an item's metadata by hand (admin)
      description: >
        Only the fields sent change, and each one sent is locked: scans and
        metadata refreshes leave it alone until the locks are cleared
        (DELETE /items/{id}/locks). poster and backdrop take a path under
        /artwork/ or an image URL.
      operationId: updateItemMetadata
      tags: [Items]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                year: { type: integer }
                overview: { type: string }
                tagline: { type: string }
                certification: { type: string }
                rating: { type: number }
                poster: { type: string }
                backdrop: { type: string }
                genres: { type: array, items: { type: string } }
      responses:
        "200": { description: The updated item, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /scans:
    get:
      summary: List recent scans, newest first
      operationId: listScans
      tags: [Administration]
      responses:
        "200":
          description: Recent scan runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scan" }

  /segments/status:
    get:
      summary: Progress of background intro and credits detection (admins and trusted editors)
      description: >
        Detection runs over film and TV libraries after each completed scan
        and once at startup, analysing only episodes not yet analysed for
        each kind, and films not yet looked at for end credits (read from
        their chapter names). Counts are of checks: an episode is checked
        once for its intro and once for its credits. Seasons and films
        asked for by name (the redetect endpoints) are listed in targets
        and analysed first. The same status is pushed over /events as
        "segments" while it runs.
      operationId: segmentStatus
      tags: [Administration]
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean, description: "False when libraries.intro_detection is off" }
                  running: { type: boolean }
                  libraryId: { type: string }
                  startedAt: { type: string, format: date-time }
                  seasonsDone: { type: integer }
                  seasonsTotal: { type: integer }
                  episodesDone: { type: integer }
                  episodesTotal: { type: integer, description: Episodes waiting when the run began }
                  filmsDone: { type: integer }
                  filmsTotal: { type: integer, description: Films waiting to be looked at for end credits when the run began }
                  introsFound: { type: integer, description: Episodes given an intro in this run }
                  creditsFound: { type: integer, description: Episodes given end credits in this run }
                  unreadable: { type: integer, description: Files whose audio could not be decoded }
                  paused: { type: boolean }
                  pauseReason:
                    type: string
                    enum: [manual, playing, scanning, schedule, on-demand]
                    description: manual = paused by an admin until resumed; playing / scanning = giving way, resuming a minute after they stop; schedule = outside the detection window; on-demand = detectionMode is manual and nobody has pressed Analyse now
                  current:
                    type: object
                    description: The season, or film, being worked on
                    properties:
                      series: { type: string, description: The series' title, or the film's }
                      season: { type: integer }
                      film: { type: boolean }
                      kind: { type: string, enum: [intro, credits] }
                      phase: { type: string, enum: [reading, comparing, saving] }
                      done: { type: integer }
                      total: { type: integer }
                  recent:
                    type: array
                    description: The latest episodes' outcomes, newest first
                    items:
                      type: object
                      properties:
                        itemId: { type: string }
                        kind: { type: string, enum: [intro, credits] }
                        series: { type: string }
                        season: { type: integer }
                        episode: { type: integer }
                        film: { type: boolean, description: series is a film's title }
                        found: { type: boolean }
                        startSecs: { type: number }
                        endSecs: { type: number }
                  last:
                    type: object
                    description: Summary of the most recent finished run
                    properties:
                      libraryId: { type: string }
                      finishedAt: { type: string, format: date-time }
                      seconds: { type: integer }
                      seasons: { type: integer }
                      episodes: { type: integer }
                      films: { type: integer }
                      introsFound: { type: integer }
                      creditsFound: { type: integer }
                      unreadable: { type: integer }
                      cancelled: { type: boolean }
                  targets:
                    type: array
                    description: >
                      Seasons and films asked for by name, in the order they
                      are analysed, ahead of any library and whatever the
                      schedule says; the first is being worked on when
                      working is set.
                    items: { $ref: "#/components/schemas/DetectionTarget" }

  /segments/redetect:
    post:
      summary: Detect a selection's intros and credits again (admins and trusted editors)
      description: >
        Any mix of episodes, seasons, series and films, up to 1000. Each
        episode is analysed alone, still compared with its season; a season
        or series covers its episodes; a film's credits are read from its
        chapter names again. Times set by hand are kept unless
        includeLocked is true; the response says how many were kept, so the
        caller can offer to replace them. The seasons and films go ahead of
        every library's queue, whatever the schedule says, still giving way
        to playback, scans and a manual pause. What was found before is
        served until it is replaced. 409 when detection is turned off.
      operationId: redetectSelection
      tags: [Administration]
      parameters:
        - $ref: "#/components/parameters/RedetectKinds"
        - $ref: "#/components/parameters/RedetectIncludeLocked"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RedetectRequest"
                - type: object
                  required: [items]
                  properties:
                    items: { type: array, maxItems: 1000, items: { type: string } }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/RedetectResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Neither an administrator nor a trusted editor }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Intro detection is turned off }

  /segments/reports:
    get:
      summary: Reports of wrong intro and credits times (admin)
      description: >
        Newest first, at most 200: the open ones, or with all=true the
        resolved ones too. Each says how many open reports its season (a
        film's, the film) has: three or more suggest detecting the season
        again. Changes are announced over /events as "segmentReports".
      operationId: listSegmentReports
      tags: [Administration]
      parameters:
        - { name: all, in: query, schema: { type: boolean }, description: Include resolved reports }
      responses:
        "200":
          description: The reports
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SegmentReport" } }

  /segments/reports/{id}/resolve:
    post:
      summary: Resolve a report of wrong times (admin)
      operationId: resolveSegmentReport
      tags: [Administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Resolved (or already was) }
        "404": { $ref: "#/components/responses/NotFound" }

  /segments/pause:
    post:
      summary: Pause background work until resumed (admin); kept across restarts
      description: >
        Holds intro and credits detection and seek-bar preview building
        before their next file. The pause is shared; both report it.
      operationId: pauseSegments
      tags: [Administration]
      responses:
        "200": { description: "The detection status, now paused (enabled: false when detection is off)" }

  /segments/resume:
    post:
      summary: Resume background work (admin)
      operationId: resumeSegments
      tags: [Administration]
      responses:
        "200": { description: "The detection status (enabled: false when detection is off)" }
  /segments/run:
    post:
      summary: Analyse now (admin)
      description: >
        Starts background work straight away — intro and credits detection
        on every TV library, and seek-bar previews for every film and
        episode without them — whatever the schedule (detectionMode) says,
        until everything waiting is done; the schedule applies again after
        that. A manual pause still holds it.
      operationId: runSegments
      tags: [Administration]
      responses:
        "202": { description: "Started; the detection status (enabled: false when detection is off)" }

  /previews/status:
    get:
      summary: Progress of background seek-bar preview building (admin)
      description: >
        Previews are built for every film and episode, newest additions
        first, after each completed scan and once at startup; a player
        asking for a title's previews moves it to the front of the queue.
        Building follows the detection schedule, pause and read-speed cap,
        gives way to playback, scans and detection, and reads one file at a
        time. The same status is pushed over /events as "previews".
      operationId: previewStatus
      tags: [Administration]
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  running: { type: boolean, description: Titles are queued; it may still be waiting (paused) }
                  current: { type: string, description: The title being worked on }
                  done: { type: integer, description: Titles given previews in this run }
                  failed: { type: integer, description: Titles whose files could not be read; tried again once the file changes or the server restarts }
                  waiting: { type: integer, description: Titles still queued }
                  paused: { type: boolean }
                  pauseReason:
                    type: string
                    enum: [manual, playing, scanning, detecting, schedule, on-demand]
                    description: As for /segments/status, plus detecting — giving way to intro and credits detection, so one of them reads at a time
                  last:
                    type: object
                    description: Summary of the most recent finished run
                    properties:
                      finishedAt: { type: string, format: date-time }
                      seconds: { type: integer }
                      done: { type: integer }
                      failed: { type: integer }

  /search:
    get:
      summary: Universal title search over movies, series, and episodes
      operationId: search
      tags: [Browse]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        "200":
          description: Matching items (series/movies ranked above episodes, max 20)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }

  /requests/status:
    get:
      summary: Whether the viewer can request titles, and which kinds
      description: >
        The client asks once to decide whether to show request screens at
        all. Enabled needs a request level other than none, a TMDB key, and
        a connected Radarr (films) or Sonarr (series).
      operationId: getRequestStatus
      tags: [Requests]
      responses:
        "200": { description: Status, content: { application/json: { schema: { $ref: "#/components/schemas/RequestStatus" } } } }
  /discover/search:
    get:
      summary: Films and series not in the viewer's libraries, from TMDB
      description: >
        For the "Not in your library" row under the library's own results.
        Titles held in a library the viewer can see are left out, as are
        films when no Radarr is connected and series when no Sonarr is.
        Each result carries the status of any open request for it. At most
        20; empty while requests are off for the viewer's server.
      operationId: discoverSearch
      tags: [Requests]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        "200":
          description: Results, in TMDB's order
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DiscoverResult" } }
        "403": { description: The viewer's request level is none }
        "502": { description: TMDB could not be reached }
  /discover/{type}/{tmdbId}:
    get:
      summary: A film or series page from TMDB, with its requests
      description: >
        Everything a detail page shows, for a title the library may not
        have. itemId is set when the viewer can see it in a library, so the
        client can go there instead. A series lists its seasons with how
        many episodes of each are on disk and any request covering them.
      operationId: discoverTitle
      tags: [Requests]
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [movie, tv] } }
        - { name: tmdbId, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: The title, content: { application/json: { schema: { $ref: "#/components/schemas/DiscoverTitle" } } } }
        "403": { description: The viewer's request level is none }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: No TMDB key is configured }
  /requests:
    get:
      summary: Requests, newest first
      description: The viewer's own; an admin passing all=1 sees everyone's.
      operationId: listRequests
      tags: [Requests]
      parameters:
        - { name: all, in: query, schema: { type: string, enum: ["1", "true"] }, description: Admins only; everyone's requests }
        - { name: status, in: query, schema: { type: string }, description: "Comma-separated statuses to include, e.g. requested,approved" }
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MediaRequest" } }
        "403": { description: The viewer's request level is none }
    post:
      summary: Request a film, a series, some of its seasons, or episodes
      description: >
        For a user at level "approval" the request waits in the admin's
        queue. At level "auto" (and for every admin) it is sent at once:
        Radarr adds the film, or Sonarr the series with the requested
        seasons monitored (a series it has already gets them monitored),
        and searches. A send that fails is still recorded, waiting for an
        admin, with the reason in error. An open request that already
        covers this one is returned with 200 instead of a new one. Seasons
        and episodes empty is the whole series.
      operationId: createRequest
      tags: [Requests]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewRequest" }
      responses:
        "201": { description: Requested, content: { application/json: { schema: { $ref: "#/components/schemas/MediaRequest" } } } }
        "200": { description: Already requested, content: { application/json: { schema: { $ref: "#/components/schemas/MediaRequest" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: The viewer's request level is none }
        "409": { description: The film is already in a library }
        "502": { description: TMDB could not be reached }
        "503": { description: No TMDB key is configured }
  /requests/{id}:
    delete:
      summary: Withdraw a request
      description: >
        Its owner may while it still waits for an admin; an admin may
        remove any. Nothing is undone in Sonarr or Radarr.
      operationId: deleteRequest
      tags: [Requests]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Withdrawn }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Already sent; only an admin can remove it now }
  /requests/{id}/approve:
    post:
      summary: Approve and send a waiting request (admin)
      description: >
        Sends it with the connection's default quality profile and root
        folder unless the body overrides them. A declined request can be
        approved after all. When the instance refuses or cannot be reached
        the request stays waiting, with the reason.
      operationId: approveRequest
      tags: [Requests]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestOverride" }
      responses:
        "200": { description: Sent, content: { application/json: { schema: { $ref: "#/components/schemas/MediaRequest" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Already sent or available }
        "502": { $ref: "#/components/responses/UpstreamFailed" }
  /requests/{id}/decline:
    post:
      summary: Decline a waiting request (admin)
      operationId: declineRequest
      tags: [Requests]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, description: Shown to the person who asked }
      responses:
        "200": { description: Declined, content: { application/json: { schema: { $ref: "#/components/schemas/MediaRequest" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Not waiting for a decision }
  /items/{id}/missing:
    get:
      summary: What a series is missing, by Sonarr's account
      description: >
        Episodes the connected Sonarr lists for the series that are not on
        disk — aired ("missing") or still to air ("upcoming", with the air
        date) — by season, leaving out specials. managed is false when no
        connected Sonarr has the series. Sonarr's answer is kept for two
        minutes.
      operationId: itemMissing
      tags: [Requests]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: A series }
      responses:
        "200": { description: The gaps, content: { application/json: { schema: { $ref: "#/components/schemas/MissingEpisodes" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: The viewer's request level is none }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamFailed" }
  /items/{id}/missing/search:
    post:
      summary: Search Sonarr now for seasons or episodes of a series
      description: >
        Monitors them and starts Sonarr's season or episode search. For
        admins and users at request level "auto"; everyone else requests
        them (POST /requests) instead.
      operationId: searchMissing
      tags: [Requests]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: A series }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seasons: { type: array, items: { type: integer } }
                episodes: { type: array, items: { $ref: "#/components/schemas/EpisodeRef" } }
      responses:
        "202": { description: Searching }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Only admins and users at level auto }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: No connected Sonarr has the series }
        "502": { $ref: "#/components/responses/UpstreamFailed" }

  /events:
    get:
      summary: Live server events (SSE)
      description: >
        A Server-Sent Events stream of state changes so clients update
        without polling. Event types: "scan" (data: a Scan, plus filesTotal
        while running — the scanner's upfront file count; admin-only),
        "items" (data: {libraryId} — that library's contents changed,
        published repeatedly during a scan as items land so open views fill
        in live), "libraries" (no data — an invalidation hint: refetch
        library lists and counts), "prefs" (no data — preferences or their
        defaults changed: refetch /auth/me/prefs; sent to everyone when an
        administrator changes defaults, otherwise only to the user
        concerned), and, sent only to the user concerned,
        "devices" (no data — refetch /auth/sessions), "handoff" (to one
        device: {from, items, index} — a queue sent by POST
        /auth/sessions/{id}/play; start playing it) and "revoked" (to one
        device, which is signed out; the stream closes after it),
        "homeassistant" (data: {entities: [HAEntity]} — states that changed,
        each sent only to users who may see that entity; or no data —
        refetch /homeassistant/rooms and /homeassistant/modes, as the
        connection, exposure, access, rooms or modes changed) and "mode-run"
        (to the user who started it: {runId, modeId, modeName, status:
        running|done|failed, step, steps, error, playedOn, playedOnName} —
        playedOn is the device the title was sent to, empty when that
        device was already playing it). Events are advisory; clients refetch what
        they display on receipt, and a dropped event costs staleness until
        the next one, not correctness.
      operationId: eventStream
      tags: [System]
      responses:
        "200":
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema: { type: string }

  /items/{id}/locks:
    delete:
      summary: Clear an item's manual edits' locks (admin)
      description: >
        Hands every edited field back to the metadata provider. The values
        stay as they are until the next refresh replaces them.
      operationId: clearItemLocks
      tags: [Administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Cleared }
        "404": { $ref: "#/components/responses/NotFound" }
  /items/{id}/segments:
    get:
      summary: An episode's intro and credits, or a film's credits, for correcting them (admins and trusted editors)
      description: >
        Each kind of segment the item can have, found or not, with whether
        detection has looked at the current file and whether someone set it
        by hand (locked: re-detection leaves it alone until cleared). A
        film has credits only.
      operationId: itemSegments
      tags: [Administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The episode's segments, content: { application/json: { schema: { $ref: "#/components/schemas/ItemSegments" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /items/{id}/segments/{kind}:
    put:
      summary: Set an episode's intro or credits, or a film's credits, by hand (admins and trusted editors)
      description: >
        Sets the segment's start and end in seconds from the start of the
        file, or with none true says the item has no segment of this kind.
        Either way the value is locked: detection, re-detection without
        includeLocked and a replaced file all leave it alone until it is
        cleared. 400 for a film's intro.
      operationId: putItemSegment
      tags: [Administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [intro, credits] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                none: { type: boolean, description: The episode has no segment of this kind }
                startSecs: { type: number, minimum: 0 }
                endSecs: { type: number, description: At least a second after startSecs, and no later than the episode's end }
      responses:
        "200": { description: The episode's segments, content: { application/json: { schema: { $ref: "#/components/schemas/ItemSegments" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Hand an item's intro or credits back to detection (admins and trusted editors)
      description: >
        Removes a value set by hand, segment and lock, so detection looks at
        the item again on its next pass. A detected value is left as it is.
      operationId: clearItemSegment
      tags: [Administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [intro, credits] } }
      responses:
        "200": { description: The episode's segments, content: { application/json: { schema: { $ref: "#/components/schemas/ItemSegments" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /items/{id}/segments/redetect:
    post:
      summary: Detect an episode, season, series or film again (admins and trusted editors)
      description: >
        An episode is analysed alone, still compared with the rest of its
        season (whose episodes are read as partners only); a season covers
        its episodes, a series every season's; a film's credits are read
        from its chapter names again. Times set by hand are kept unless
        includeLocked is true. The seasons and films go ahead of every
        library's queue, whatever the schedule says, still giving way to
        playback, scans and a manual pause. What was found before is served
        until it is replaced. 409 when intro detection is turned off.
      operationId: redetectSegments
      tags: [Administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/RedetectKinds"
        - $ref: "#/components/parameters/RedetectIncludeLocked"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedetectRequest" }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/RedetectResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Neither an administrator nor a trusted editor }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Intro detection is turned off }
  /items/{id}/segments/reports:
    post:
      summary: Report wrong intro or credits times
      description: >
        Anyone who can see an episode or film can say its intro or credits
        skip is in the wrong place, with where playback was and an
        optional note (at most 500 characters). A user's open report on the
        same item and kind is updated rather than repeated. Administrators
        see reports on the Activity page (GET /segments/reports).
      operationId: createSegmentReport
      tags: [Playback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [intro, credits], description: A film has credits only }
                positionSecs: { type: number, minimum: 0 }
                note: { type: string, maxLength: 500 }
      responses:
        "201": { description: Recorded, content: { application/json: { schema: { $ref: "#/components/schemas/SegmentReport" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /items/{id}/trickplay.vtt:
    get:
      summary: Seek-bar preview cues for a video
      description: >
        WebVTT cues pointing into the sprite sheet at trickplay.jpg.
        Previews are made in the background (see /previews/status), usually
        before a title is first played. Until they exist — or while they are
        older than the file — this answers 202 with no body and moves the
        title to the front of the queue; they are never built while anything
        is playing, so the player shows none this time. 404 for an audio
        track.
      operationId: trickplayVTT
      tags: [Playback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The cues, content: { text/vtt: {} } }
        "202": { description: Queued; ask again on the next play }
        "404": { $ref: "#/components/responses/NotFound" }
  /items/{id}/trickplay.jpg:
    get:
      summary: Seek-bar preview sprite sheet for a video
      operationId: trickplaySheet
      tags: [Playback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The sprite sheet, content: { image/jpeg: {} } }
        "404": { description: Not generated yet, or no such item }

  /items/{id}/matches:
    get:
      summary: Candidate TMDB matches for an item (admin)
      description: >
        Used by the admin "Fix match" dialogue. q and year default to the
        item's own, so the common case needs no arguments. All candidates are
        returned rather than just the best: TMDB's year parameter only nudges
        relevance rather than filtering, so the top hit is regularly wrong for
        a common title.
      operationId: itemMatches
      tags: [Administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: q, in: query, required: false, schema: { type: string }, description: Title to search for (default the item's own) }
        - { name: year, in: query, required: false, schema: { type: integer }, description: Year hint; 0 drops it }
      responses:
        "200":
          description: Candidates, best first
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  year: { type: integer }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/MatchCandidate" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: No TMDB key configured }

  /items/{id}/match:
    put:
      summary: Pin an item to a chosen TMDB title (admin)
      description: >
        The "fix match" operation. Unlike a scan this replaces the title,
        overview and artwork outright — the operator has just asserted which
        film it is, so keeping what the wrong match left behind would defeat
        the point.
      operationId: applyMatch
      tags: [Administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tmdbId]
              properties:
                tmdbId: { type: integer }
      responses:
        "200": { description: Updated item, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { description: No TMDB key configured }

  /items/{id}/refresh:
    post:
      summary: Re-run metadata matching for an item (admin)
      description: >
        Re-derives the title from the file path rather than the stored title,
        so a refresh also recovers from an earlier bad match having
        overwritten it.
      operationId: refreshItem
      tags: [Administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Updated item, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        "404": { description: No match found }
        "503": { description: No TMDB key configured }

  /people/{id}:
    get:
      summary: A person and the library titles they are credited on
      description: >
        Backs "more with this actor". Only titles the viewer may see are
        returned, so a person credited on a library this user has no grant
        for does not leak its contents.
      operationId: getPerson
      tags: [Browse]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Person and their titles
          content:
            application/json:
              schema:
                type: object
                properties:
                  person: { $ref: "#/components/schemas/Person" }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries/{id}/genres:
    get:
      summary: The genres this library actually holds, with counts
      description: >
        Derived from the films rather than a fixed vocabulary, so a library
        never offers a genre nothing is tagged with. Alternative versions are
        excluded, so a film held twice counts once.
      operationId: libraryGenres
      tags: [Libraries]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Genres, most common first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    genre: { type: string }
                    count: { type: integer }

  /libraries/{id}/refresh:
    post:
      summary: Re-match a library's metadata in the background (admin)
      description: >
        Looks every item up with the metadata provider again, paced so it
        never crowds out playback. With itemIds, only those items; with q or
        unmatched, only what the Manage list's filter matches (q is a
        case-insensitive substring of title or path; unmatched means no
        provider match) — and a filter that matches nothing is refused rather
        than falling back to the whole library. Progress arrives as
        "refresh" events and from GET.
      operationId: refreshLibrary
      tags: [Administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                itemIds: { type: array, items: { type: string } }
                q: { type: string }
                unmatched: { type: boolean }
      responses:
        "202": { description: Started, content: { application/json: { schema: { $ref: "#/components/schemas/RefreshProgress" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: A refresh is already running for this library }
    get:
      summary: Progress of a library's refresh (admin)
      operationId: refreshStatus
      tags: [Administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Progress; running is false when none is under way, content: { application/json: { schema: { $ref: "#/components/schemas/RefreshProgress" } } } }
    delete:
      summary: Cancel a library's refresh (admin)
      operationId: cancelRefresh
      tags: [Administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Cancelled }
        "404": { description: No refresh is running for this library }

  /libraries/{id}/recommended:
    get:
      summary: The library's Recommended tab, as rows of items
      description: >
        Built server-side so every client shows the same rows. Recently added
        leads, ranked as on the home screen — series by their newest episode
        for TV, each series carrying latestEpisode when one arrived in the
        last six weeks — and is left out for media types without that
        listing. The rest are recommendations for the viewer: because you watched, highly
        rated and unseen, genre rows and unwatched. Every item carries the
        viewer's own watch state.
      operationId: libraryRecommended
      tags: [Libraries]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Rows in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [kind, title, items]
                  properties:
                    kind: { type: string, enum: [recent, because, toprated, genre, unwatched] }
                    title: { type: string }
                    genre: { type: string, description: Set on a genre row, so its heading can open the full genre listing }
                    items:
                      type: array
                      items: { $ref: "#/components/schemas/Item" }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries/{id}/new-episodes:
    get:
      summary: A TV library's New episodes row
      description: >
        Episodes in the library that aired in the last six weeks, newest
        broadcast first and, of a day's broadcasts, the latest to arrive;
        at most 20. Episodes with no air date are left out, and a back
        catalogue fetched today is not new: it is the broadcast that counts.
        A file that was on disk more than a week before its air date is
        taken for a mismatch and left out too.
        Each carries its series (title and artwork, since an episode title
        alone does not say which show it is) and the viewer's own watch
        state. The home screen has the same row across every TV library the
        viewer may see.
      operationId: libraryNewEpisodes
      tags: [Libraries]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Episodes, newest first; empty when nothing aired lately
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ResumeItem" }
        "400": { description: Not a TV library }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries/{id}/listening:
    get:
      summary: The viewer's listening rows for a music library
      description: >
        Albums the viewer played a track from, most recent first; their most
        played tracks; and the albums whose tracks they played most. Built
        from play counts, which outlive the pruned play history.
      operationId: libraryListening
      tags: [Music]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The rows; each may be empty
          content:
            application/json:
              schema:
                type: object
                required: [recentlyPlayed, mostPlayed, mostPlayedAlbums]
                properties:
                  recentlyPlayed: { type: array, items: { $ref: "#/components/schemas/Item" } }
                  mostPlayed: { type: array, items: { $ref: "#/components/schemas/Item" } }
                  mostPlayedAlbums: { type: array, items: { $ref: "#/components/schemas/Item" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /playlists:
    get:
      summary: Your playlists
      description: >
        The requesting user's playlists by name, each summarised over the
        tracks they can play now. Playlists are personal: nobody else sees
        them, admins included.
      operationId: listPlaylists
      tags: [Music]
      responses:
        "200":
          description: Playlists
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Playlist" }
    post:
      summary: Create a playlist
      description: >
        A manual playlist, or a smart one when rules are given. Smart rules
        are checked here; an unknown field, an operator the field lacks or a
        value of the wrong kind is refused with the rule named.
      operationId: createPlaylist
      tags: [Music]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /playlists/{id}:
    get:
      summary: A playlist and its tracks
      description: >
        Tracks in playlist order; a smart playlist is evaluated now, so it
        follows the library and the listener's history. Tracks in libraries
        the user can no longer see are left out. Each carries the user's
        play count.
      operationId: getPlaylist
      tags: [Music]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The playlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Rename a playlist, or change a smart playlist's rules
      description: Absent fields are left alone. A manual playlist cannot be given rules.
      operationId: updatePlaylist
      tags: [Music]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistRequest" }
      responses:
        "200":
          description: The playlist as it now is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a playlist
      operationId: deletePlaylist
      tags: [Music]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /playlists/{id}/items:
    post:
      summary: Add to the end of a manual playlist
      description: >
        Tracks, albums or artists: an album adds its tracks in order, an
        artist their albums oldest first. Anything the user cannot see is
        skipped. A smart playlist refuses with 400.
      operationId: appendPlaylistItems
      tags: [Music]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistItems" }
      responses:
        "200":
          description: The playlist as it now is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Replace a manual playlist's tracks
      description: >
        The tracks, in the order given — how a client reorders and removes.
        A track may appear more than once.
      operationId: setPlaylistItems
      tags: [Music]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistItems" }
      responses:
        "200":
          description: The playlist as it now is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries/{id}/collections:
    post:
      summary: Create a collection of your own (admin)
      operationId: createCollection
      tags: [Collections]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                itemIds: { type: array, items: { type: string }, description: Its films, in order; may be empty }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Collection" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
    get:
      summary: The collections this library holds more than one film from
      description: >
        Collections come from the metadata provider's own grouping (TMDB's
        belongs_to_collection), so Harry Potter, James Bond, The Lord of the
        Rings and the rest are detected without any franchise list of our
        own — a film simply has to be matched. A collection the library holds
        only one film from is excluded: labelling a single film as a set is
        noise rather than grouping. Alternative versions are excluded, so a
        film held twice counts once.
      operationId: libraryCollections
      tags: [Collections]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Collections, largest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Collection" }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries/{id}/collections/{key}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - name: key
        in: path
        required: true
        schema: { type: string }
        description: '"tmdb:<id>" for a provider collection, the row id for a managed one'
    get:
      summary: One collection and its films, in the collection's order
      operationId: collectionItems
      tags: [Collections]
      responses:
        "200": { description: The collection, content: { application/json: { schema: { $ref: "#/components/schemas/CollectionDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Rename a collection (admin)
      description: >
        Editing a provider collection adopts it: its membership and order are
        copied into Cineva and are managed there from then on, so a later scan
        cannot undo the edit.
      operationId: renameCollection
      tags: [Collections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200": { description: The collection, content: { application/json: { schema: { $ref: "#/components/schemas/CollectionDetail" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a managed collection (admin)
      description: >
        Where it overrode a provider collection, the provider's grouping
        reappears — so this doubles as "revert to the provider's answer". A
        provider collection that was never edited cannot be deleted (400).
      operationId: deleteCollection
      tags: [Collections]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /libraries/{id}/collections/{key}/items:
    put:
      summary: Set a collection's films and their order (admin)
      description: >
        The body is the list wanted, so adding, removing and reordering are
        one call. Adopts a provider collection first, as PATCH does.
      operationId: setCollectionItems
      tags: [Collections]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds: { type: array, items: { type: string }, description: In the order to play them }
      responses:
        "200": { description: The collection, content: { application/json: { schema: { $ref: "#/components/schemas/CollectionDetail" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /integrations:
    get:
      summary: List connected Sonarr and Radarr instances (admin)
      description: >
        Cineva registers a webhook in each, so what they import is scanned in
        within seconds rather than at the next scheduled rescan. API keys are
        never returned.
      operationId: listIntegrations
      tags: [Integrations]
      responses:
        "200":
          description: Connections, by kind then name
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Integration" } }
    post:
      summary: Connect a Sonarr or Radarr instance and register Cineva's webhook in it (admin)
      description: >
        Checks the URL and API key against the instance's system status (and
        that it is the kind named), then creates a webhook connection there
        called "Cineva", subscribed to imports, upgrades, renames and
        deletions. The instance tests the webhook by calling Cineva back
        before it saves it, so callbackUrl must be Cineva's address as the
        instance reaches it; it defaults to the address this request was
        made to. Nothing is kept when any step fails.
      operationId: createIntegration
      tags: [Integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationRequest" }
      responses:
        "201":
          description: Connected, with the webhook registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Another integration already has this name }
        "502": { $ref: "#/components/responses/UpstreamFailed" }

  /integrations/{id}:
    patch:
      summary: Change a connection and register its webhook again (admin)
      description: >
        Blank fields keep their current values. The webhook is registered
        again with a new secret, which also repairs one deleted on the
        instance's side; if the instance refuses, the previous connection and
        webhook are left as they were. When the URL changes, the webhook is
        removed from the old instance where it can still be reached.
      operationId: updateIntegration
      tags: [Integrations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Another integration already has this name }
        "502": { $ref: "#/components/responses/UpstreamFailed" }
    delete:
      summary: Disconnect, removing Cineva's webhook from the instance (admin)
      operationId: deleteIntegration
      tags: [Integrations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Disconnected and the webhook removed }
        "200":
          description: >
            Disconnected, but the instance could not be reached to remove the
            webhook. It is left behind and fails Cineva's check from now on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  warning: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /integrations/{id}/status:
    get:
      summary: Check a connection live (admin)
      description: >
        The Test button: whether the instance answers and its version, its
        health warnings, the quality profiles and root folders requests can
        use, and path mappings suggested by comparing its root folders with
        Cineva's library folders (the same name, or the only one of each).
        A connection that cannot be reached answers 200 with reachable
        false and the reason.
      operationId: integrationStatus
      tags: [Integrations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Status, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationStatus" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /integrations/{id}/options:
    put:
      summary: Set what requests use and how paths map (admin)
      description: >
        The quality profile and root folder requests sent to this instance
        are made with (0 and "" use the instance's first), and path
        mappings from the instance's paths to Cineva's, so a webhook event
        rescans the one library holding the file rather than every library
        of its type. Saved without contacting the instance; empty rows are
        dropped.
      operationId: setIntegrationOptions
      tags: [Integrations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                qualityProfileId: { type: integer }
                rootFolder: { type: string }
                pathMaps: { type: array, items: { $ref: "#/components/schemas/PathMap" } }
      responses:
        "200": { description: The connection, content: { application/json: { schema: { $ref: "#/components/schemas/Integration" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /integrations/{id}/webhook:
    post:
      summary: Receive a Sonarr or Radarr webhook event
      description: >
        Called by the instance, not by users: public, authenticated with HTTP
        basic auth as user "cineva" and the connection's secret, which Cineva
        generates when it registers the webhook. Every delivery is noted as
        the connection's last event. Events that add, replace, rename or
        remove files (Download, ImportComplete, Rename, SeriesDelete,
        EpisodeFileDelete, MovieDelete, MovieFileDelete) rescan the
        libraries of the connection's media type that contain the event's
        paths, translated by the connection's path mappings — or all of
        them, when none does (as when the instance sees the files at
        different paths in a container and no mapping says how). A rescan
        requested while one is running follows it. Grab moves requests for
        the title to downloading. Other events, including Test, are
        acknowledged and otherwise ignored.
      operationId: integrationWebhook
      tags: [Integrations]
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Sonarr or Radarr's webhook payload; only the fields below are read.
              properties:
                eventType: { type: string }
                series: { type: object, properties: { id: { type: integer }, title: { type: string }, tvdbId: { type: integer }, path: { type: string } } }
                episodes: { type: array, items: { type: object, properties: { seasonNumber: { type: integer }, episodeNumber: { type: integer } } } }
                episodeFile: { type: object, properties: { path: { type: string } } }
                episodeFiles: { type: array, items: { type: object, properties: { path: { type: string } } } }
                movie: { type: object, properties: { id: { type: integer }, title: { type: string }, year: { type: integer }, tmdbId: { type: integer }, folderPath: { type: string } } }
                movieFile: { type: object, properties: { path: { type: string } } }
      responses:
        "200":
          description: Acknowledged; the event does not change files
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "202":
          description: Rescans started or queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Missing or wrong webhook credentials }
        "404": { $ref: "#/components/responses/NotFound" }

  /homeassistant:
    get:
      summary: The Home Assistant connection and its live status (admin)
      description: >
        Answers 200 with configured false when no instance is connected. The
        access token is never returned.
      operationId: getHomeAssistant
      tags: [Home Assistant]
      responses:
        "200": { description: The connection, content: { application/json: { schema: { $ref: "#/components/schemas/HAConnection" } } } }
    put:
      summary: Connect Home Assistant, or change the connection (admin)
      description: >
        Opens the websocket and authenticates before anything is saved, so a
        wrong URL or token is refused with Home Assistant's own reason. A
        blank token keeps the current one. playbackEvents is refused (400)
        when the token's user is not an administrator in Home Assistant,
        which firing events requires.
      operationId: putHomeAssistant
      tags: [Home Assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HAConnectionRequest" }
      responses:
        "200": { description: Connected, content: { application/json: { schema: { $ref: "#/components/schemas/HAConnection" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/HAUnreachable" }
    delete:
      summary: Disconnect Home Assistant (admin)
      description: >
        Removes the connection only. Exposed entities, their access, rooms
        and modes are kept, so connecting the same instance again restores
        them.
      operationId: deleteHomeAssistant
      tags: [Home Assistant]
      responses:
        "204": { description: Disconnected }
  /homeassistant/entities:
    get:
      summary: Every entity Cineva can work with, exposed or not (admin)
      description: Entities in the supported domains, with their area, state, exposure and access. Empty while disconnected.
      operationId: listHAEntities
      tags: [Home Assistant]
      responses:
        "200":
          description: Entities, by area then name
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/HAEntityAdmin" } }
  /homeassistant/entities/{entityId}:
    put:
      summary: Expose or hide an entity, and set who can use it (admin)
      description: >
        A camera exposed without an access object is restricted with nobody
        listed, so only admins see it until someone is granted it.
      operationId: putHAEntity
      tags: [Home Assistant]
      parameters:
        - { name: entityId, in: path, required: true, schema: { type: string }, example: light.lounge }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exposed]
              properties:
                exposed: { type: boolean }
                access: { $ref: "#/components/schemas/LibraryAccess" }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/HAEntityAdmin" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /homeassistant/entities/{entityId}/action:
    post:
      summary: Work a control (turn a light on, set the volume)
      description: >
        Only the services and fields listed for the entity's domain in
        docs/homeassistant.md are accepted, on an exposed entity the caller
        may see. Answers with the call accepted; the new state arrives as a
        homeassistant event.
      operationId: haEntityAction
      tags: [Home Assistant]
      parameters:
        - { name: entityId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HAAction" }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/HAUnreachable" }
  /homeassistant/devices:
    get:
      summary: Every user's devices and the rooms they are in (admin)
      operationId: listHADevices
      tags: [Home Assistant]
      responses:
        "200":
          description: Devices, by user then name
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, userId, userName, name, online, areaId]
                  properties:
                    id: { type: string }
                    userId: { type: string }
                    userName: { type: string }
                    name: { type: string, description: The device's name, or its browser and system when unnamed }
                    online: { type: boolean }
                    areaId: { type: string, description: Its room; "" for none }
  /homeassistant/devices/{id}/area:
    put:
      summary: Put a device in a room, or take it out (admin)
      operationId: putHADeviceArea
      tags: [Home Assistant]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [areaId]
              properties:
                areaId: { type: string, description: A Home Assistant area id; "" for none }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/NotFound" }
  /homeassistant/rooms:
    get:
      summary: The rooms, controls and cameras the caller may see
      description: >
        Areas holding at least one exposed entity the caller may see, with
        those entities' current state; entities with no area come under
        an area with id "". Answers configured false when no instance is
        connected, and connected false while it is unreachable (the last
        known states are still listed).
      operationId: haRooms
      tags: [Home Assistant]
      responses:
        "200": { description: Rooms, content: { application/json: { schema: { $ref: "#/components/schemas/HARooms" } } } }
  /homeassistant/cameras/{entityId}/snapshot:
    get:
      summary: A visible camera's current picture
      operationId: haCameraSnapshot
      tags: [Home Assistant]
      parameters:
        - { name: entityId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The picture, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/HAUnreachable" }
  /homeassistant/cameras/{entityId}/hls/{file}:
    get:
      summary: Live view of a visible camera (HLS playlist or init segment)
      description: >
        Home Assistant's own HLS stream, proxied. Start at
        master_playlist.m3u8; the playlists' relative paths lead to the
        rest. 404 for a camera that cannot stream.
      operationId: haCameraHLS
      tags: [Home Assistant]
      parameters:
        - { name: entityId, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string }, example: master_playlist.m3u8 }
      responses:
        "200": { description: The file, content: { application/vnd.apple.mpegurl: {}, video/mp4: {} } }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/HAUnreachable" }
  /homeassistant/cameras/{entityId}/hls/{dir}/{file}:
    get:
      summary: Live view of a visible camera (segments and parts)
      operationId: haCameraHLSPart
      tags: [Home Assistant]
      parameters:
        - { name: entityId, in: path, required: true, schema: { type: string } }
        - { name: dir, in: path, required: true, schema: { type: string, enum: [segment, part] } }
        - { name: file, in: path, required: true, schema: { type: string }, example: 12.m4s }
      responses:
        "200": { description: The segment, content: { video/iso.segment: {} } }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/HAUnreachable" }
  /homeassistant/modes:
    get:
      summary: Modes the caller may run
      description: An admin gets every mode, with its access list.
      operationId: listHAModes
      tags: [Home Assistant]
      responses:
        "200":
          description: Modes, by name
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/HAMode" } }
    post:
      summary: Build a mode (admin)
      operationId: createHAMode
      tags: [Home Assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HAModeRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/HAMode" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Another mode already has this name }
  /homeassistant/modes/{id}:
    patch:
      summary: Change a mode (admin)
      description: Fields left out keep their values; steps, when sent, replace all of them.
      operationId: updateHAMode
      tags: [Home Assistant]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HAModeRequest" }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/HAMode" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Another mode already has this name }
    delete:
      summary: Delete a mode (admin)
      operationId: deleteHAMode
      tags: [Home Assistant]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /homeassistant/modes/{id}/run:
    post:
      summary: Run a mode
      description: >
        Checked before anything runs: Home Assistant is connected, every
        step's entity exists, a play step's device has Cineva open, and its
        title (the one sent here, for a mode that plays the started-from
        title) is visible to the caller and to the device's user. The steps
        then run in the background; mode-run events report each one to the
        caller. A play step whose device is already playing that title
        leaves it playing, so a mode started from the player sets the room
        around the film rather than starting it again.
      operationId: runHAMode
      tags: [Home Assistant]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                itemId: { type: string, description: The title it was started from; required when needsTitle }
      responses:
        "202":
          description: Running
          content:
            application/json:
              schema:
                type: object
                required: [runId]
                properties:
                  runId: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Home Assistant is unreachable, or the play step's device does not have Cineva open }
  /fs/dirs:
    get:
      summary: List subdirectories of a server path (admin folder picker)
      description: >
        Directories only, one level at a time — never file contents. Hidden
        (dot) directories are omitted unless hidden=1. Symlinked directories
        are followed so linked media mounts are browsable.
      operationId: listDirs
      tags: [Administration]
      parameters:
        - { name: path, in: query, required: false, schema: { type: string }, description: Absolute path (default "/") }
        - { name: hidden, in: query, required: false, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  parent: { type: string }
                  dirs:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        path: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Permission denied }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: "The folder did not answer within 15 s (a network share that has stopped responding)" }

  /stats/system:
    get:
      summary: Host CPU/RAM samples for the admin dashboard
      description: >
        In-memory samples only: range=1h returns every sample from the last
        hour (default 5 s apart); range=24h returns one per minute for the
        last day. Live samples are also pushed on the /events stream as
        "stats" events.
      operationId: systemStats
      tags: [Administration]
      parameters:
        - { name: range, in: query, required: false, schema: { type: string, enum: [1h, 24h], default: 1h } }
      responses:
        "200":
          description: Samples, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    at: { type: string, format: date-time }
                    cpuPct: { type: number, description: Whole-host CPU busy, 0–100 }
                    memUsed: { type: integer, description: Bytes (MemTotal − MemAvailable) }
                    memTotal: { type: integer }
                    procRss: { type: integer, description: This server's resident set, bytes }
                    numCpu: { type: integer }

  /stats/plays:
    get:
      summary: Plays per day by media kind
      description: >
        One entry per UTC day for the last `days` days including empty days.
        Every POST /items/{id}/play is recorded; a "plays" event is pushed on
        the /events stream when the history changes.
      operationId: playStats
      tags: [Administration]
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, default: 30, maximum: 365 } }
      responses:
        "200":
          description: Days, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date: { type: string, format: date }
                    movies: { type: integer }
                    episodes: { type: integer }
                    tracks: { type: integer }

  /stats/plays/totals:
    get:
      summary: Watch totals for the last `days` days
      description: >
        Aggregates play history: how many plays started, how many reached the
        watched threshold (90% of runtime), and the total wall-clock seconds
        those playbacks were open. Duration is time the playback was open
        rather than playhead movement, so seeking does not inflate or deflate
        it. Rows recorded before the duration columns existed count as a play
        with zero seconds and not completed, which is what was measured for
        them. Separate from /stats/plays because that endpoint returns a bare
        array and response shapes do not change within a version.
      operationId: playTotals
      tags: [Administration]
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, default: 30, maximum: 365 } }
      responses:
        "200":
          description: Totals over the window
          content:
            application/json:
              schema:
                type: object
                properties:
                  plays: { type: integer, description: Playbacks started }
                  completed: { type: integer, description: Playbacks that reached 90% of runtime }
                  secs: { type: integer, description: Total wall-clock seconds of playback }

  /playbacks/{userId}/{itemId}:
    delete:
      summary: End a playback (admin)
      description: >
        Ends a playback whether or not it is transcoding, which is how a
        direct play is stopped at all: the server only answers range requests
        for those, so there is no session to kill. The playback is dropped
        from the activity list and marked stopped; the owning client is
        refused on its next POST /items/{id}/progress with 409 and stops
        playing, which takes up to the heartbeat interval (~15 s). A
        transcode session, if present, is torn down immediately. The mark
        expires after 90 seconds, so the viewer can start the item again by
        hand — this ends a stream, it does not revoke access.
      operationId: stopPlaybackAdmin
      tags: [Playback]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Ended }
        "404": { description: No such playback }

  /items/{id}/playback:
    delete:
      summary: Client has stopped playing the item
      description: >
        Drops the item from the active-playback list immediately (and tears
        down its transcode session, if any). Without this, an entry lingers
        until the client misses its progress heartbeats (45 s).
      operationId: stopPlayback
      tags: [Playback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Stopped }

  /items/{id}/playback/stop:
    post:
      summary: Beacon-friendly alias of DELETE /items/{id}/playback
      description: navigator.sendBeacon can only POST; used on page unload.
      operationId: stopPlaybackBeacon
      tags: [Playback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Stopped }

  /stats/disks:
    get:
      summary: Disk space on every filesystem backing a library
      description: >
        Library paths on the same filesystem are grouped into one volume.
        freeBytes is what an unprivileged writer could use. Paths that cannot
        be stat'ed are listed last with an error.
      operationId: diskStats
      tags: [Administration]
      responses:
        "200":
          description: Volumes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    paths: { type: array, items: { type: string } }
                    libraries: { type: array, items: { type: string } }
                    totalBytes: { type: integer }
                    freeBytes: { type: integer }
                    usedBytes: { type: integer }
                    error: { type: string }

  /logs:
    get:
      summary: Audit trail — who did what, when, from where
      description: >
        Newest first. Actions are dotted verbs (library.create,
        library.delete, scan.start, scan.cancel, scan.completed, scan.failed,
        play.start, download, transcode.stop); `action` filters by prefix.
        Scan completions are recorded by user "system". A "logs" event is
        pushed on /events whenever an entry is added.
      operationId: auditLog
      tags: [Administration]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 100, maximum: 500 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
        - { name: action, in: query, required: false, schema: { type: string }, description: Action prefix filter }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    at: { type: string }
                    userId: { type: string }
                    action: { type: string }
                    targetKind: { type: string }
                    targetId: { type: string }
                    targetTitle: { type: string }
                    detail: { type: string }
                    clientIp: { type: string }
                    client: { type: string, description: "Browser · OS" }

  /scans/{id}/cancel:
    post:
      summary: Cancel a running scan
      description: >
        Scans owned by this server process stop within one file; a stale
        'running' row left by a dead process is marked failed. Starting a
        scan while one is running for the same library is rejected with 409
        (the scans table is the cross-process lock).
      operationId: cancelScan
      tags: [Administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Cancellation initiated (or stale row cleared) }
        "409": { description: Scan is not running }

  /items/{id}/play:
    post:
      summary: Start playback — decides direct play vs HLS transcode
      description: >
        The body optionally carries the device's decode capabilities (detected
        client-side) and a quality choice. quality "auto" negotiates (direct
        play when capable, else remux with AAC audio); "original" forces
        direct play; "1080p"/"720p"/"480p" force a video re-encode at that
        level. Starting playback replaces any existing session for the item.
        Music tracks always answer direct play (browsers decode
        flac/mp3/aac/ogg/opus natively); capabilities/quality are ignored for
        them. The music hierarchy (artist -> album -> ordered tracks) is
        served by the same /libraries/{id}/items and /items/{id} endpoints.
      operationId: playItem
      tags: [Playback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                containers: { type: array, items: { type: string } }
                videoCodecs: { type: array, items: { type: string } }
                audioCodecs: { type: array, items: { type: string } }
                quality:
                  type: string
                  enum: [auto, original, 1080p, 720p, 480p]
                fromStart:
                  type: boolean
                  description: Ignore the stored resume position and play from 00:00
                audioTrack:
                  type: integer
                  description: >
                    Stream index of the audio to play. Absent: the user's
                    preferred language (preference `audio-lang`), else the
                    file's default.
                burnSubtitle:
                  type: integer
                  description: >
                    Stream index of an image subtitle (PGS, VobSub) to paint
                    into the picture, which forces a re-encode. 0 or absent
                    leaves the subtitle to the user's preferences
                    (`sub-mode`, `sub-lang`); -1 means the viewer has chosen
                    and the preferences are not applied.
      responses:
        "200":
          description: How to play the item, including the resume position
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{id}/stream:
    get:
      summary: Direct play the original file (supports HTTP range requests)
      operationId: streamItem
      tags: [Playback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [original, opus, aac, mp3, ogg] }, description: Music only — stream a cached transcode instead of the file (Opus for bandwidth, AAC as the universal browser fallback) }
        - { name: quality, in: query, required: false, schema: { type: integer, enum: [64, 96, 128, 192, 256, 320] }, description: Bitrate in kbps for transcoded formats (default 192) }
      description: >
        Every read of the file has a deadline: if the storage stops answering
        part-way through a response, the response is cut short rather than
        left hanging, and the next request is refused with 503 once the
        library has been found unreachable.
      responses:
        "200": { description: The media file }
        "206": { description: Partial content (range request) }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }

  /items/{id}/download:
    get:
      summary: Download an item — original file, or a streamed ZIP for containers
      description: >
        Playable items (movie, episode, track) download their original file.
        Container items (season, series, album, artist) stream a stored
        (uncompressed) ZIP of every descendant file, one folder level per
        container ("Season 02/...").
      operationId: downloadItem
      tags: [Playback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [original, mp3, ogg] }, description: Music only — transcode tracks (or every track in an album/artist ZIP) }
        - { name: quality, in: query, required: false, schema: { type: integer, enum: [128, 192, 256, 320] }, description: Bitrate in kbps for transcoded formats (default 192) }
      responses:
        "200": { description: "The media file or ZIP archive, Content-Disposition attachment. A file is served with range support; if the storage stops answering part-way, the response is cut short (a ZIP ends early) rather than left hanging." }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }

  /items/{id}/watched:
    put:
      summary: Mark an item watched or unwatched by hand
      description: >
        Separate from /progress, which reports the playhead and lets the ~90%
        threshold decide. Progress only ever raises the watched flag, so this
        is the only way to lower it. Both directions clear the resume
        position: marking watched should stop offering a resume, and marking
        unwatched should start from the beginning.
      operationId: setWatched
      tags: [Playback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [watched]
              properties:
                watched: { type: boolean }
      responses:
        "200": { description: Updated play state, content: { application/json: { schema: { $ref: "#/components/schemas/PlayState" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{id}/progress:
    post:
      summary: Report playback position (crossing ~90% marks the item watched)
      operationId: postProgress
      tags: [Playback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionSecs]
              properties:
                positionSecs: { type: integer }
                paused: { type: boolean, description: Sent with each heartbeat (every 15 s, even while paused) so the admin Activity page can show state; music positions are not stored as resume state }
      responses:
        "200":
          description: Updated play state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayState" }
        "409":
          description: >
            An administrator ended this playback (see DELETE
            /playbacks/{userId}/{itemId}). The client should stop playing and
            release the stream; the position sent with this request is still
            saved, so resume lands where the viewer got to. Said once — a
            later attempt to play the item again succeeds.

  /items/{id}/next-up:
    get:
      summary: Where to carry on in a series or season
      description: >
        The episode this series or season should play next, for the user
        making the request. Carries on with whatever is part-watched (more
        than 10 seconds in and not finished), otherwise the first episode
        never started, otherwise the first episode again because everything
        is watched. Episodes are ordered by season then number, so the
        pointer crosses season boundaries without the client knowing anything
        about the hierarchy — which is why this lives on the server: the web
        client and the native apps must not disagree about where someone is
        up to. 204 when the item is not a series or season, or has no
        episodes.
      operationId: nextUpFor
      tags: [Playback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The episode to play
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/Item" }
                  positionSecs: { type: integer, description: Resume position; 0 unless reason is "resume" }
                  reason:
                    type: string
                    enum: [resume, next, restart]
                    description: >
                      Which promise the client's button should make — carry
                      on part-way through, start one never begun, or watch
                      the series again from the beginning.
        "204": { description: Not a series or season, or it has no episodes }

  /items/{id}/next:
    get:
      summary: Server-side next-up decision — the episode after this one
      operationId: nextUp
      tags: [Playback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The next episode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "204": { description: No next episode (end of series, or not an episode) }

  /items/{id}/prev:
    get:
      summary: The episode before this one (player back button)
      operationId: prevEpisode
      tags: [Playback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The next episode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "204": { description: No next episode (end of series, or not an episode) }

  /items/{id}/subtitles:
    get:
      summary: List an item's subtitle tracks (embedded and sidecar)
      operationId: itemSubtitles
      tags: [Playback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Subtitle tracks; text tracks carry a WebVTT url
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubtitleTrack" }

  /subtitles/{file}:
    get:
      summary: A text subtitle track extracted/converted to WebVTT (cached server-side)
      operationId: subtitleVTT
      tags: [Playback]
      parameters:
        - { name: file, in: path, required: true, schema: { type: string }, description: 'The track id with ".vtt" on the end, as /items/{id}/subtitles lists it' }
      responses:
        "200":
          description: WebVTT content
          content:
            text/vtt: {}
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Image-based track — needs burn-in, not yet available }
        "503": { $ref: "#/components/responses/StorageUnavailable" }

  /items/{id}/storage:
    get:
      summary: Check the storage behind an item now
      description: >
        For a client whose playback has stopped receiving data and wants to
        say why. The item's library folders are checked at the time of the
        request (not read from the last 30-second check), bounded by the
        check's own 5-second deadline, so this answers promptly even when the
        share does not. Also unavailable while an earlier read of the item's
        file is still blocked. The result updates the library's storage
        status, and a change is announced on /events as usual.
      operationId: itemStorage
      tags: [Playback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The storage's state
          content:
            application/json:
              schema:
                type: object
                required: [available, library]
                properties:
                  available: { type: boolean }
                  since: { type: string, format: date-time, description: When the library's state last changed }
                  path: { type: string, description: The folder or file that failed }
                  error: { type: string, description: 'How it failed, e.g. "not responding", "host is down"' }
                  library: { type: string, description: The library's name }
                  message: { type: string, description: The sentence to show when unavailable — which library, which folder, what to check }
        "404": { $ref: "#/components/responses/NotFound" }

  /continue-watching:
    get:
      summary: In-progress items for the home screen, most recent first
      description: Limited to the libraries the viewer may see; at most 20.
      operationId: continueWatching
      tags: [Browse]
      responses:
        "200":
          description: Items with resume positions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ResumeItem" }

  /home:
    get:
      summary: Everything the home screen shows, in one request
      description: >
        Limited to the libraries the viewer may see. Continue Watching holds
        one entry per series (its most recently played episode); Next Up is
        the next unstarted episode of each recently watched series that has
        nothing part-watched; New Episodes is what aired in the last six
        weeks across the TV libraries, as /libraries/{id}/new-episodes lists
        it for one; shelves are each library's recently added row
        (series ordered by their newest episode for TV) followed by the first
        two recommendation rows of each film and TV library.
      operationId: home
      tags: [Browse]
      responses:
        "200":
          description: The home screen's rows
          content:
            application/json:
              schema:
                type: object
                required: [continueWatching, nextUp, newEpisodes, shelves]
                properties:
                  continueWatching:
                    type: array
                    items: { $ref: "#/components/schemas/ResumeItem" }
                  nextUp:
                    type: array
                    items: { $ref: "#/components/schemas/ResumeItem" }
                  newEpisodes:
                    type: array
                    items: { $ref: "#/components/schemas/ResumeItem" }
                  shelves:
                    type: array
                    items:
                      type: object
                      properties:
                        libraryId: { type: string }
                        libraryName: { type: string }
                        kind: { type: string, description: '"recent"; for a music library "played" (recently played albums) or "mostPlayed" (most played albums); or a recommendation row kind (because, toprated, genre, unwatched)' }
                        title: { type: string }
                        genre: { type: string }
                        items:
                          type: array
                          items: { $ref: "#/components/schemas/Item" }

  /play/sessions:
    get:
      summary: Everything playing right now — direct or transcoded, video or music
      description: >
        One entry per active playback (user + item) with client details
        (IP, browser, OS from the User-Agent), mode/quality, position and
        paused state from the client's heartbeats, and the live transcode
        session when there is one. Entries expire 45 s after the last
        heartbeat. A "sessions" event is pushed on /events on every change.
      operationId: listSessions
      tags: [Playback]
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlaySession" }

  /play/{sid}/index.m3u8:
    get:
      summary: HLS VOD playlist for a session
      operationId: hlsPlaylist
      tags: [Playback]
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The playlist
          content:
            application/vnd.apple.mpegurl: {}
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }

  /play/{sid}/{file}:
    get:
      summary: HLS session asset (init.mp4 or segNNNNN.m4s); blocks until produced, seeking restarts the transcoder
      description: >
        A request waits up to 30 s for the file. While it waits, a watchdog
        checks that the transcoder is still reading its source: if nothing
        has been read for 20 s, the storage is taken to have stopped
        answering, the session ends, and this and every later request for
        the session (and its playlist) answers 503 with the storage message.
        A transcoder ahead of the viewer, or a viewer who has paused, is
        never judged stalled.
      operationId: hlsFile
      tags: [Playback]
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The segment }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { description: The transcoder stopped with an error before producing the file; the message says how }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
        "504": { description: Segment not produced in time }

  /play/{sid}:
    delete:
      summary: Stop a playback session and delete its temp files
      operationId: stopSession
      tags: [Playback]
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Stopped }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cineva_session
      description: Set by POST /auth/login (or /auth/pin, /auth/setup); what browsers use.
    bearerKey:
      type: http
      scheme: bearer
      description: An API key (cnv_...), for apps and scripts.
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: The same API key, for clients that cannot set Authorization.
  parameters:
    RedetectKinds:
      name: kinds
      in: query
      description: Comma-separated kinds to detect again (intro, credits); every kind when absent. Overrides kinds in the body.
      schema: { type: string, example: "intro,credits" }
    RedetectIncludeLocked:
      name: includeLocked
      in: query
      description: true replaces times set by hand as well, as includeLocked in the body does.
      schema: { type: boolean }
  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, user] }
        disabled: { type: boolean }
        hasPassword: { type: boolean }
        hasPin: { type: boolean }
        createdAt: { type: string }
        avatar: { type: string, description: The user's picture (an /artwork/ path); absent when they have none }
        avatarColour: { $ref: "#/components/schemas/AvatarColour" }
        requestLevel: { $ref: "#/components/schemas/RequestLevel" }
        segmentEditor: { type: boolean, description: "A trusted editor: may correct intro and credits times and start their detection on the titles they can see, without being an admin" }
        libraryIds:
          type: array
          items: { type: string }
          description: >
            Every library this user can see, computed: the open libraries,
            plus restricted ones that name the user or a group they belong
            to; every library for an admin. Read-only — access is set per
            library (PUT /libraries/{id}/access).
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, minLength: 8 }
        displayName: { type: string }
    Integration:
      type: object
      required: [id, kind, name, url, callbackUrl, notificationId, version]
      properties:
        id: { type: string }
        kind: { type: string, enum: [sonarr, radarr] }
        name: { type: string }
        url: { type: string, description: The instance's base URL }
        callbackUrl: { type: string, description: Cineva's address as the instance reaches it }
        notificationId: { type: integer, description: The webhook's id inside the instance; 0 if not registered }
        version: { type: string, description: The instance's version when the connection was last saved or tested }
        createdAt: { type: string }
        updatedAt: { type: string }
        qualityProfileId: { type: integer, description: What requests are made with; 0 uses the instance's first }
        rootFolder: { type: string, description: Where requested titles go; "" uses the instance's first }
        pathMaps: { type: array, items: { $ref: "#/components/schemas/PathMap" } }
        lastEvent: { type: string, description: 'The last webhook delivery''s type, e.g. "Download"' }
        lastEventTitle: { type: string, description: 'What it was about, e.g. "Show S02E04"' }
        lastEventAt: { type: string }
    PathMap:
      type: object
      description: 'One translation of an instance''s path prefix into Cineva''s: Sonarr in a container sees /tv where Cineva sees /mnt/media/TV.'
      properties:
        from: { type: string, description: As the instance sees it }
        to: { type: string, description: As Cineva sees it }
    IntegrationStatus:
      type: object
      properties:
        reachable: { type: boolean }
        error: { type: string, description: Why it could not be reached, or which of the lists failed }
        version: { type: string }
        health:
          type: array
          items:
            type: object
            properties:
              source: { type: string }
              type: { type: string, enum: [ok, notice, warning, error] }
              message: { type: string }
        qualityProfiles:
          type: array
          items: { type: object, properties: { id: { type: integer }, name: { type: string } } }
        rootFolders:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              path: { type: string }
              freeSpace: { type: integer, description: Bytes }
              accessible: { type: boolean }
        suggestedPathMaps: { type: array, items: { $ref: "#/components/schemas/PathMap" } }
    RequestLevel:
      type: string
      enum: [none, approval, auto]
      description: >
        What happens when a user asks for a title not in the library: none
        hides requests altogether, approval puts them in the admin's queue,
        auto sends them straight to Sonarr or Radarr. Admins are always
        auto, whatever is stored.
    RequestStatus:
      type: object
      properties:
        level: { $ref: "#/components/schemas/RequestLevel" }
        movies: { type: boolean, description: A Radarr is connected }
        tv: { type: boolean, description: A Sonarr is connected }
        tmdb: { type: boolean, description: A TMDB key is configured }
        enabled: { type: boolean, description: Request screens are worth showing }
    EpisodeRef:
      type: object
      properties:
        season: { type: integer }
        episode: { type: integer }
    NewRequest:
      type: object
      required: [mediaType, tmdbId]
      properties:
        mediaType: { type: string, enum: [movie, tv] }
        tmdbId: { type: integer }
        seasons: { type: array, items: { type: integer }, description: Series only; with episodes empty too, the whole series }
        episodes: { type: array, items: { $ref: "#/components/schemas/EpisodeRef" }, description: Series only; single episodes }
    RequestOverride:
      type: object
      description: Blank fields use the connection's defaults.
      properties:
        connectionId: { type: string, description: Another Sonarr or Radarr of the right kind }
        qualityProfileId: { type: integer }
        rootFolder: { type: string }
        note: { type: string, description: Shown to the person who asked }
    MediaRequest:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        userName: { type: string, description: The requester's display name }
        mediaType: { type: string, enum: [movie, tv] }
        tmdbId: { type: integer }
        tvdbId: { type: integer }
        title: { type: string }
        year: { type: integer }
        poster: { type: string, description: TMDB artwork URL }
        backdrop: { type: string }
        seasons: { type: array, items: { type: integer } }
        episodes: { type: array, items: { $ref: "#/components/schemas/EpisodeRef" } }
        status:
          type: string
          enum: [requested, approved, downloading, available, declined]
          description: >
            requested: waiting for an admin, or for an instance that could
            not be reached (error says why). approved: sent. downloading:
            the instance grabbed a release. available: a scan found it in a
            library. declined: an admin said no (note may say why).
        connectionId: { type: string }
        qualityProfileId: { type: integer }
        rootFolder: { type: string }
        arrId: { type: integer, description: The title's id inside Sonarr or Radarr once sent }
        note: { type: string }
        error: { type: string }
        decidedBy: { type: string }
        decidedAt: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    DiscoverResult:
      type: object
      properties:
        mediaType: { type: string, enum: [movie, tv] }
        tmdbId: { type: integer }
        title: { type: string }
        year: { type: integer }
        overview: { type: string }
        poster: { type: string, description: TMDB artwork URL }
        backdrop: { type: string }
        request: { type: string, description: Status of the newest open request for it; absent when there is none }
    DiscoverTitle:
      type: object
      properties:
        mediaType: { type: string, enum: [movie, tv] }
        tmdbId: { type: integer }
        title: { type: string }
        originalTitle: { type: string }
        year: { type: integer }
        overview: { type: string }
        tagline: { type: string }
        poster: { type: string }
        backdrop: { type: string }
        genres: { type: array, items: { type: string } }
        rating: { type: number }
        voteCount: { type: integer }
        runtimeMins: { type: integer }
        certification: { type: string, description: In the server's certification region }
        status: { type: string, description: 'Series only; TMDB''s wording, e.g. "Returning Series"' }
        network: { type: string }
        cast:
          type: array
          items: { $ref: "#/components/schemas/DiscoverCredit" }
        crew:
          type: array
          items: { $ref: "#/components/schemas/DiscoverCredit" }
        seasons:
          type: array
          description: Series only
          items:
            type: object
            properties:
              seasonNumber: { type: integer }
              name: { type: string }
              episodeCount: { type: integer }
              airDate: { type: string }
              poster: { type: string }
              held: { type: integer, description: Episodes of it on disk }
              request: { type: string, description: Status of an open request covering it }
        itemId: { type: string, description: The library item, when the viewer can see one }
        requests:
          type: array
          description: Open requests for the title, newest first; else the newest closed one
          items: { $ref: "#/components/schemas/MediaRequest" }
        canRequest: { type: boolean }
    DiscoverCredit:
      type: object
      properties:
        tmdbId: { type: integer }
        name: { type: string }
        role: { type: string, description: Character for cast, job for crew }
        profile: { type: string }
    MissingEpisodes:
      type: object
      properties:
        tmdbId: { type: integer, description: "The series' TMDB id, which a request for its gaps names" }
        managed: { type: boolean, description: A connected Sonarr has the series }
        connection: { type: string, description: Its name }
        seasons:
          type: array
          items:
            type: object
            properties:
              seasonNumber: { type: integer }
              held: { type: integer, description: Episodes on disk }
              total: { type: integer, description: Episodes Sonarr lists }
              episodes:
                type: array
                items:
                  type: object
                  properties:
                    season: { type: integer }
                    episode: { type: integer }
                    title: { type: string }
                    airDate: { type: string }
                    status: { type: string, enum: [missing, upcoming] }
                    monitored: { type: boolean }
        requests:
          type: array
          description: Open requests for the series
          items: { $ref: "#/components/schemas/MediaRequest" }
    IntegrationRequest:
      type: object
      description: On create, kind, url and apiKey are required. On update, kind is ignored and blank fields keep their values.
      properties:
        kind: { type: string, enum: [sonarr, radarr] }
        name: { type: string, description: 'Unique among integrations, ignoring case; defaults to "Sonarr" or "Radarr"' }
        url: { type: string }
        apiKey: { type: string, writeOnly: true }
        callbackUrl: { type: string }
    WebhookResult:
      type: object
      properties:
        event: { type: string }
        rescanning: { type: array, items: { type: string }, description: Names of the libraries rescanning }
    AvatarColour:
      type: string
      enum: ["", accent-2, chart-1, chart-2, chart-3, ok, err]
      description: >
        The theme token a user's initial is drawn on, so each theme supplies
        its own colour; "" is the default.
    Device:
      type: object
      description: A signed-in browser session.
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string, description: Chosen by the user; "" when unnamed }
        client: { type: string, description: 'Browser and system, from the User-Agent: "Chrome · Android"' }
        clientIp: { type: string }
        createdAt: { type: string }
        lastSeenAt: { type: string }
        expiresAt: { type: string }
        current: { type: boolean, description: The device making this request }
        online: { type: boolean, description: Has the app open now, so can be sent a queue }
        areaId: { type: string, description: 'The Home Assistant area it is in (its room); "" for none' }
        queue:
          type: object
          description: Its play queue, when it has one
          properties:
            count: { type: integer }
            index: { type: integer }
            current: { $ref: "#/components/schemas/Item" }
            seriesTitle: { type: string, description: The current item's series, for an episode }
            updatedAt: { type: string }
    AdminDevice:
      type: object
      required: [id, name, client, areaId, userId, autoUserId, online]
      properties:
        id: { type: string }
        name: { type: string, description: Chosen name; "" when unnamed }
        client: { type: string, description: 'Browser and system: "Chrome · Android"' }
        clientIp: { type: string }
        areaId: { type: string, description: Its Home Assistant room; "" for none }
        createdAt: { type: string }
        lastSeenAt: { type: string }
        userId: { type: string, description: Who is signed in on it now; "" for nobody }
        userName: { type: string }
        autoUserId: { type: string, description: Who it signs in as when nobody is; "" for nobody }
        online: { type: boolean, description: Has the app open now }
    QueueRequest:
      type: object
      required: [itemIds]
      properties:
        itemIds: { type: array, maxItems: 500, items: { type: string } }
        index: { type: integer, minimum: 0, description: The item playing (or to play first) }
    HandoffQueue:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Item" } }
        index: { type: integer }
    RefreshProgress:
      type: object
      properties:
        libraryId: { type: string }
        done: { type: integer }
        total: { type: integer }
        matched: { type: integer }
        failed: { type: integer }
        running: { type: boolean }
    UserGroup:
      type: object
      required: [id, name, priority, memberIds]
      properties:
        id: { type: string }
        name: { type: string }
        priority: { type: integer, description: "Where groups' preference defaults conflict, the lowest number wins" }
        memberIds: { type: array, items: { type: string } }
        createdAt: { type: string }
    PrefOption:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }
        description: { type: string, description: "What choosing it does, shown while it is selected" }
    PrefEntry:
      type: object
      description: One preference the server knows, as its registry describes it.
      required: [key, type, default, scope, lockable, section, label, description]
      properties:
        key: { type: string }
        type:
          type: string
          enum: [bool, enum, int, string, list]
          description: "bool is on or off; enum is one of options; int is within min and max; list is a JSON array of strings"
        default: { type: string, description: The built-in value }
        scope: { type: string, enum: [person, device], description: "Whether it follows the person or stays with the device" }
        lockable: { type: boolean, description: Whether an administrator may lock it }
        section: { type: string, description: The Settings section it appears in }
        label: { type: string }
        description: { type: string }
        options: { type: array, items: { $ref: "#/components/schemas/PrefOption" } }
        min: { type: integer }
        max: { type: integer }
        hideWhen:
          type: object
          description: Hidden while another preference has this value
          properties:
            key: { type: string }
            value: { type: string }
    PrefSection:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
    PrefOrigin:
      type: object
      required: [value, source]
      properties:
        value: { type: string }
        source: { type: string, enum: [device, user, group, server, builtin] }
        groupId: { type: string }
        groupName: { type: string }
    ResolvedPref:
      description: A preference's value for you, and where it came from.
      allOf:
        - { $ref: "#/components/schemas/PrefOrigin" }
        - type: object
          required: [locked]
          properties:
            locked: { type: boolean, description: "Set by your administrator: source and groupName say whose lock it is" }
            default:
              $ref: "#/components/schemas/PrefOrigin"
              description: "What applies without your own choices: what Reset goes back to. Absent for keys the registry does not know."
    MyPrefs:
      type: object
      required: [sections, registry, prefs]
      properties:
        device: { type: string, description: "The device resolved for; absent for an API key" }
        sections: { type: array, items: { $ref: "#/components/schemas/PrefSection" } }
        registry: { type: array, items: { $ref: "#/components/schemas/PrefEntry" } }
        prefs: { type: object, additionalProperties: { $ref: "#/components/schemas/ResolvedPref" } }
    PrefSetting:
      type: object
      required: [value]
      properties:
        value: { type: string }
        locked: { type: boolean }
    PrefDefaultsRequest:
      type: object
      description: "By key: a setting, or null to clear the key"
      additionalProperties:
        oneOf:
          - { $ref: "#/components/schemas/PrefSetting" }
          - { type: "null" }
    PrefDefaults:
      type: object
      required: [sections, registry, server, groups]
      properties:
        sections: { type: array, items: { $ref: "#/components/schemas/PrefSection" } }
        registry: { type: array, items: { $ref: "#/components/schemas/PrefEntry" } }
        server: { type: object, additionalProperties: { $ref: "#/components/schemas/PrefSetting" } }
        groups:
          type: array
          description: Every group, in priority order
          items:
            type: object
            required: [id, name, priority, defaults]
            properties:
              id: { type: string }
              name: { type: string }
              priority: { type: integer }
              defaults: { type: object, additionalProperties: { $ref: "#/components/schemas/PrefSetting" } }
    UserGroupRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        memberIds: { type: array, items: { type: string } }
    HAConnectionRequest:
      type: object
      description: On first connect url and token are required. Blank fields keep their values.
      properties:
        name: { type: string, description: Defaults to "Home Assistant" }
        url: { type: string, example: "http://homeassistant.local:8123" }
        token: { type: string, writeOnly: true, description: A long-lived access token, made on the user's profile page in Home Assistant }
        playbackEvents: { type: boolean, description: Fire cineva_playback_* events into Home Assistant; needs an admin user there }
    HAConnection:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean }
        name: { type: string }
        url: { type: string }
        connected: { type: boolean, description: The websocket is open and authenticated }
        version: { type: string, description: Home Assistant's version, from the last connect }
        isAdmin: { type: boolean, description: The token's user is an administrator in Home Assistant }
        playbackEvents: { type: boolean }
        error: { type: string, description: Why it is not connected, when it is not }
        entities: { type: integer, description: Entities in supported domains }
        exposed: { type: integer, description: Of which exposed }
        createdAt: { type: string }
        updatedAt: { type: string }
    HAEntity:
      type: object
      description: An entity's state, normalised. Fields that do not apply to its domain are left out.
      required: [entityId, domain, name, areaId, state, available]
      properties:
        entityId: { type: string, example: light.lounge }
        domain: { type: string, enum: [light, switch, fan, input_boolean, cover, media_player, scene, script, camera] }
        name: { type: string, description: Its friendly name }
        areaId: { type: string, description: Its area, or its device's; "" for none }
        state: { type: string, description: 'Home Assistant''s state: "on", "off", "playing", "open", ...' }
        available: { type: boolean, description: False when Home Assistant reports it unavailable or unknown }
        on: { type: boolean, description: Lights, switches, fans, input booleans, media players }
        dimmable: { type: boolean, description: A light that takes brightness_pct }
        brightnessPct: { type: integer, minimum: 0, maximum: 100 }
        volume: { type: number, minimum: 0, maximum: 1, description: A media player's volume }
        muted: { type: boolean }
        source: { type: string, description: A media player's input }
        sources: { type: array, items: { type: string } }
        mediaTitle: { type: string, description: What a media player says is playing }
        position: { type: integer, minimum: 0, maximum: 100, description: A cover's position, 100 open }
        stream: { type: boolean, description: A camera that can stream live }
    HAEntityAdmin:
      allOf:
        - { $ref: "#/components/schemas/HAEntity" }
        - type: object
          required: [exposed, access]
          properties:
            exposed: { type: boolean }
            access: { $ref: "#/components/schemas/LibraryAccess" }
    HAArea:
      type: object
      required: [id, name, entities]
      properties:
        id: { type: string, description: Home Assistant's area id; "" for entities with no area }
        name: { type: string }
        entities: { type: array, items: { $ref: "#/components/schemas/HAEntity" } }
    HARooms:
      type: object
      required: [configured, connected, areas, currentAreaId]
      properties:
        configured: { type: boolean }
        connected: { type: boolean }
        areas: { type: array, items: { $ref: "#/components/schemas/HAArea" }, description: By name; cameras are among their area's entities }
        allAreas:
          type: array
          description: Every area in Home Assistant, for choosing this device's room
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        currentAreaId: { type: string, description: This device's room; "" for none }
        currentDeviceId: { type: string, description: This device's id, to tell whether a mode played here or sent the title elsewhere }
    HAAction:
      type: object
      required: [service]
      properties:
        service: { type: string, example: turn_on, description: One allowed for the entity's domain }
        brightnessPct: { type: integer, minimum: 0, maximum: 100, description: light.turn_on }
        volume: { type: number, minimum: 0, maximum: 1, description: media_player.volume_set }
        muted: { type: boolean, description: media_player.volume_mute }
        source: { type: string, description: media_player.select_source; one of the entity's sources }
    HAModeStep:
      type: object
      required: [type]
      description: >
        action: service on entityId with the HAAction fields. wait: seconds
        (1 to 30). play: on deviceId, the title itemId, or the title the mode
        is started from when itemId is empty.
      properties:
        type: { type: string, enum: [action, wait, play] }
        entityId: { type: string }
        service: { type: string }
        brightnessPct: { type: integer, minimum: 0, maximum: 100 }
        volume: { type: number, minimum: 0, maximum: 1 }
        muted: { type: boolean }
        source: { type: string }
        seconds: { type: integer, minimum: 1, maximum: 30 }
        deviceId: { type: string }
        itemId: { type: string }
    HAModeRequest:
      type: object
      description: On create name and steps are required.
      properties:
        name: { type: string, description: Unique among modes, ignoring case }
        steps: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/HAModeStep" } }
        access: { $ref: "#/components/schemas/LibraryAccess" }
    HAMode:
      type: object
      required: [id, name, steps, needsTitle]
      properties:
        id: { type: string }
        name: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/HAModeStep" } }
        needsTitle: { type: boolean, description: It plays the title it is started from, so running it needs itemId }
        areaId: { type: string, description: The room its play step's device is in; "" when it plays nothing or the device has no room }
        access: { $ref: "#/components/schemas/LibraryAccess" }
        createdAt: { type: string }
        updatedAt: { type: string }
    LibraryAccess:
      type: object
      required: [restricted, userIds, groupIds]
      properties:
        restricted: { type: boolean, description: "False: every user sees the library, and the lists are ignored" }
        userIds: { type: array, items: { type: string } }
        groupIds: { type: array, items: { type: string } }
    UserRequest:
      type: object
      properties:
        username: { type: string, description: Create only }
        displayName: { type: string }
        password: { type: string, minLength: 8, description: On create, required unless a PIN is given (admins always); on update, resets it }
        role: { type: string, enum: [admin, user] }
        disabled: { type: boolean }
        pin: { type: string, description: "Quick sign-in PIN (4–6 digits); on update, empty string removes it. A regular user may be PIN-only (no password); admins must have a password." }
        avatarColour: { $ref: "#/components/schemas/AvatarColour" }
        requestLevel: { $ref: "#/components/schemas/RequestLevel" }
        segmentEditor: { type: boolean, description: Make the user a trusted editor of intro and credits times, or stop them being one }
    Settings:
      type: object
      properties:
        detectionRateMB:
          type: integer
          enum: [0, 50, 25, 10]
          description: >
            Cap on how fast background work — intro and credits detection,
            and seek-bar previews — reads media, in MB/s; 0 is no cap.
            Default 10. With a cap, files are read one at a time. Background
            work also always pauses while anything plays or a scan runs, and
            stops as soon as a library's storage stops answering.
        detectionMode:
          type: string
          enum: [window, idle, manual]
          description: >
            When background work — intro and credits detection, and
            seek-bar previews — may read media. window (the default): only
            between detectionWindowStart and detectionWindowEnd. idle:
            whenever nothing is playing or scanning. manual: only after POST
            /segments/run.
        detectionWindowStart:
          type: string
          description: '"HH:MM", server local time; default 02:00. The window may run past midnight.'
        detectionWindowEnd:
          type: string
          description: '"HH:MM", server local time; default 06:00.'
        detectionRateOptions:
          type: array
          items: { type: integer }
          description: Read-only; the caps offered.
        loginMode:
          type: string
          enum: [picker, form]
          description: picker = every user as a tile, then their PIN or password; form = username + password-or-PIN box. Default from auth.login_mode.
        hwAccel:
          type: boolean
          description: >
            Whether new transcode sessions may use the GPU. Default true;
            with no usable device the server transcodes on the CPU regardless.
            Takes effect on the next session, not on sessions already running.
        hwAccelStatus:
          type: string
          readOnly: true
          description: >
            The backend detected at startup, for display beside the switch —
            e.g. "vaapi (/dev/dri/renderD128)", "nvenc", or "none" when the
            host has no usable hardware transcoder.
        certRegion:
          type: string
          description: >
            ISO 3166-1 country whose content rating is stored and shown.
            Certifications are issued per country by different boards, so a
            BBFC "15" and an FSK "16" are different judgements rather than two
            spellings of one value. Falls back to the US rating where a title
            is unclassified in the chosen region. Default from
            metadata.cert_region (GB). Applies to titles scanned or refreshed
            afterwards; existing rows keep the rating they were given.
          example: GB
        certRegions:
          type: array
          readOnly: true
          items: { type: string }
          description: The regions this server offers, for the admin picker.
        requestDefaultLevel:
          allOf: [{ $ref: "#/components/schemas/RequestLevel" }]
          description: The request level new accounts start at. Default approval.
        requestLevels:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/RequestLevel" }
        tmdbConfigured:
          type: boolean
          readOnly: true
          description: Whether a TMDB key is available. Without one, titles outside the library cannot be looked up and requests are off.
    APIKey:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
        createdAt: { type: string }
        lastUsedAt: { type: string }
    MediaType:
      type: string
      enum: [movies, tv, music, audiobooks, podcasts, books]

    Collection:
      type: object
      description: >
        A set of films — grouped by the metadata provider ("The Matrix
        Collection"), or made and edited by an admin.
      properties:
        key: { type: string, description: '"tmdb:<id>" for a provider collection, the row id for a managed one' }
        tmdbId: { type: integer }
        name: { type: string }
        count: { type: integer, description: How many of the set this library holds }
        poster: { type: string, description: The earliest film's poster, so the row is recognisable }
        managed: { type: boolean, description: An admin has edited it; membership and order are Cineva's own }
        watched: { type: integer, description: How many of its films the viewer has finished }
        nextUpId: { type: string, description: The first film the viewer has not finished, in order; absent once all are }
        nextUpName: { type: string }
    CollectionDetail:
      type: object
      properties:
        collection: { $ref: "#/components/schemas/Collection" }
        items: { type: array, items: { $ref: "#/components/schemas/Item" } }

    Theme:
      type: object
      properties:
        id: { type: string, description: "Folder name; stylesheet at /themes/{id}/theme.css" }
        name: { type: string }
        appearance: { type: string, enum: [dark, light] }

    Library:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mediaType: { $ref: "#/components/schemas/MediaType" }
        source: { type: string, enum: [local, federated] }
        paths:
          type: array
          items: { type: string }
        itemCount: { type: integer, description: Playable items (movies + episodes) }
        createdAt: { type: string }
        updatedAt: { type: string }
        restricted: { type: boolean, description: "Seen only by the users and groups in its access (GET /libraries/{id}/access); otherwise open to everyone" }
        fullScanQueued: { type: boolean, description: "A full rescan is queued for a quiet time (PUT /libraries/{id}/scan/queued); absent when not" }
        storage:
          type: object
          description: >
            Whether the library's folders can be reached, from a check every
            30 s, and at once when a read of one of its files times out.
            While unavailable, play, stream, download and subtitle requests
            for its items fail at once with 503, scans fail, and intro
            detection skips it.
          properties:
            available: { type: boolean }
            since: { type: string, format: date-time, description: When it last changed }
            path: { type: string, description: The folder that failed }
            error: { type: string, description: 'How it failed, e.g. "not responding", "host is down"' }

    Item:
      type: object
      properties:
        id: { type: string, format: uuid }
        libraryId: { type: string, format: uuid }
        kind: { type: string, enum: [movie, series, season, episode, artist, album, track] }
        parentId: { type: string }
        title: { type: string }
        year: { type: integer }
        seasonNum: { type: integer }
        episodeNum: { type: integer }
        discNum: { type: integer }
        trackNum: { type: integer }
        artist: { type: string, description: Display artist (music kinds) }
        path: { type: string }
        sizeBytes: { type: integer, format: int64 }
        runtimeSecs: { type: integer }
        container: { type: string }
        videoCodec: { type: string }
        audioCodec: { type: string }
        width: { type: integer }
        height: { type: integer }
        tmdbId: { type: integer }
        overview: { type: string }
        poster: { type: string, description: Server-relative artwork URL (/artwork/...) }
        addedAt: { type: string }
        updatedAt: { type: string }
        versionOf:
          type: string
          description: >
            Id of the item this is an alternative version of — the same film
            at a different quality. Empty for a primary, which is what the
            library grid lists.
        rating: { type: number, format: double, description: Provider score, 0-10 }
        voteCount: { type: integer }
        certification:
          type: string
          description: >
            Content rating for the server's configured region ("15",
            "PG-13"). Free text: the scale is per-country, since each board
            classifies separately. See Settings.certRegion.
        tagline: { type: string }
        backdrop: { type: string, description: Server-relative wide artwork URL }
        collectionId: { type: integer }
        collectionName: { type: string, description: e.g. "The Matrix Collection" }
        genres:
          type: array
          items: { type: string }
          description: Filled by the endpoints that need it, not by every item query.
        latestEpisode:
          type: object
          description: >
            On a series in a recently added row, when an episode of it
            arrived in the last six weeks: the newest to arrive, so a client
            can label the series with what is new ("S6 · E5") rather than
            the year it began. Absent otherwise.
          required: [id, title, seasonNum, episodeNum, addedAt]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            seasonNum: { type: integer }
            episodeNum: { type: integer }
            addedAt: { type: string, description: When the file arrived }
            airDate: { type: string, description: 'Broadcast date, "2026-10-08"' }
        watched:
          type: boolean
          description: >
            The requesting user's own state, stamped on by the library
            listing and on a season's episodes in item detail. Shared across a film's versions: it is recorded against
            the primary.
        positionSecs:
          type: integer
          description: The requesting user's resume position, as for watched.
        playCount:
          type: integer
          description: >
            How many times the requesting user has played the item — for an
            album in a listening row, its tracks' plays summed. A play counts
            once it ends far enough in: a track half way or four minutes in,
            a film or episode once watched. Stamped on by the library
            listing, an album's tracks in item detail, the listening rows,
            artist pages and playlists.
        lastPlayedAt: { type: string, description: When the requesting user's last counted play was, as for playCount }

    ArtistPage:
      type: object
      required: [artist, albums, appearsOn, topTracks, stats]
      properties:
        artist: { $ref: "#/components/schemas/Item" }
        albums: { type: array, items: { $ref: "#/components/schemas/Item" } }
        appearsOn: { type: array, items: { $ref: "#/components/schemas/Item" } }
        topTracks: { type: array, items: { $ref: "#/components/schemas/Item" } }
        stats:
          type: object
          properties:
            tracks: { type: integer, description: Tracks on the artist's own albums }
            secs: { type: integer, description: Their total running time }
            plays: { type: integer, description: The viewer's plays of them }
        bioUrl: { type: string, description: The Wikipedia article the biography (the artist's overview) is from, to credit it }
        lookingUp: { type: boolean, description: A picture and biography are being looked up now }
    SmartRules:
      type: object
      description: >
        Tracks matching all (or any) of the rules, sorted and cut to a
        limit. Fields and their operators — artist (is, isNot, contains;
        the track's or the album's artist), album (is, contains), title
        (contains), genre (is, isNot; from the files' tags), year (is, gt,
        lt), format (is; container or codec, e.g. flac), added (inLast,
        notInLast; days), plays (is, gt, lt; the user's own), lastPlayed
        (inLast, notInLast; days, and never played counts as not in the
        last N days).
      properties:
        match: { type: string, enum: [all, any], default: all }
        rules:
          type: array
          items:
            type: object
            required: [field, op, value]
            properties:
              field: { type: string, enum: [artist, album, title, genre, year, format, added, plays, lastPlayed] }
              op: { type: string, enum: [is, isNot, contains, gt, lt, inLast, notInLast] }
              value: { type: string, description: Text, or a whole number as text for year, added, plays and lastPlayed }
        sort:
          type: string
          enum: [random, title, artist, album, year, added, plays, lastPlayed, leastRecent]
          default: random
          description: random reshuffles on every read; leastRecent puts the longest unplayed first
        limit: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    Playlist:
      type: object
      required: [id, name, trackCount, durationSecs, covers]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        smart: { $ref: "#/components/schemas/SmartRules" }
        trackCount: { type: integer, description: Tracks the user can play now }
        durationSecs: { type: integer }
        covers: { type: array, items: { type: string }, description: Up to four distinct album covers, for a mosaic }
        createdAt: { type: string }
        updatedAt: { type: string }
    PlaylistDetail:
      type: object
      required: [playlist, tracks]
      properties:
        playlist: { $ref: "#/components/schemas/Playlist" }
        tracks: { type: array, items: { $ref: "#/components/schemas/Item" } }
    PlaylistRequest:
      type: object
      properties:
        name: { type: string, description: Required to create }
        smart: { $ref: "#/components/schemas/SmartRules" }
    PlaylistItems:
      type: object
      required: [itemIds]
      properties:
        itemIds: { type: array, items: { type: string, format: uuid }, description: Track, album or artist ids }
    PlayInfo:
      type: object
      properties:
        mode: { type: string, enum: [direct, hls] }
        url: { type: string }
        sessionId: { type: string }
        durationSecs: { type: integer }
        positionSecs: { type: integer, description: Resume point }
        reason: { type: string, description: Why transcoding was chosen }
        subtitles:
          type: array
          items: { $ref: "#/components/schemas/SubtitleTrack" }
        audio:
          type: array
          description: The file's audio streams, for the player's track picker.
          items: { $ref: "#/components/schemas/AudioTrack" }
        audioTrack:
          type: integer
          description: >
            Stream index actually being played: the one requested, else the
            first in the user's preferred language, else the file's default.
            -1 when the file has no audio.
        subtitle:
          type: string
          description: >
            Id of the subtitle the user's preferences switched on, for the
            player to show from the start. A text track is overlaid by the
            player; an image track is already burned in (see
            burnedSubtitle). Absent when none is on.
        burnedSubtitle:
          type: integer
          description: >
            Stream index of the image subtitle painted into the picture,
            chosen by the viewer or by their preferences. Absent when none.
        segments:
          type: array
          description: >
            Parts of the episode found by detection: an intro the player
            offers to skip, and end credits, where the up-next card appears
            and autoplay counts down. Reaching the credits also marks the
            episode watched. Absent until something has been found.
          items: { $ref: "#/components/schemas/Segment" }
        source:
          $ref: "#/components/schemas/PlaySource"

    ResumeItem:
      description: An item with the viewer's resume position; an episode also carries its series.
      allOf:
        - { $ref: "#/components/schemas/Item" }
        - type: object
          properties:
            positionSecs: { type: integer }
            seriesId: { type: string }
            seriesTitle: { type: string, description: "An episode's series; absent for anything else" }
            seriesPoster: { type: string }
            seriesBackdrop: { type: string }

    Segment:
      type: object
      description: A part of an item that is not the item itself, in seconds from the start of the file.
      required: [kind, startSecs, endSecs]
      properties:
        kind: { type: string, enum: [intro, credits] }
        startSecs: { type: number }
        endSecs: { type: number }

    SegmentState:
      type: object
      description: Where one kind of segment stands for an episode or film.
      required: [kind, found, analysed, locked]
      properties:
        kind: { type: string, enum: [intro, credits] }
        found: { type: boolean, description: The item has this segment; startSecs and endSecs are its bounds }
        startSecs: { type: number }
        endSecs: { type: number }
        analysed: { type: boolean, description: Detection has looked at the current file, or the value was set by hand }
        locked: { type: boolean, description: Set by hand — a segment, or that there is none — and left alone by detection }

    ItemSegments:
      type: object
      required: [detection, runtimeSecs, segments]
      properties:
        detection: { type: boolean, description: Intro detection is on, so the item can be re-detected }
        runtimeSecs: { type: integer }
        segments:
          type: array
          items: { $ref: "#/components/schemas/SegmentState" }

    DetectionTarget:
      type: object
      description: A season or film asked for by name, waiting for detection or being worked on.
      required: [itemId, kind, title, working]
      properties:
        itemId: { type: string, description: The season's or film's id }
        kind: { type: string, enum: [season, film] }
        libraryId: { type: string }
        seriesId: { type: string, description: A season's series }
        title: { type: string, description: The series' title, or the film's }
        season: { type: integer }
        working: { type: boolean }

    RedetectRequest:
      type: object
      properties:
        kinds: { type: array, items: { type: string, enum: [intro, credits] }, description: Only these kinds; every kind when absent }
        includeLocked: { type: boolean, description: Replace times set by hand as well }

    RedetectResult:
      type: object
      required: [items, reopened, locked]
      properties:
        items: { type: integer, description: Episodes and films in scope }
        reopened: { type: integer, description: Analyses sent back to detection; those never made are due already and not counted }
        locked: { type: integer, description: Items whose hand-set times were kept (0 with includeLocked) }

    SegmentReport:
      type: object
      required: [id, itemId, userId, kind, positionSecs, createdAt, itemKind, title, seasonOpen]
      properties:
        id: { type: string }
        itemId: { type: string }
        userId: { type: string }
        userName: { type: string }
        kind: { type: string, enum: [intro, credits] }
        positionSecs: { type: number, description: Where playback was when it was reported }
        note: { type: string }
        createdAt: { type: string }
        resolvedAt: { type: string, description: Absent while open }
        resolvedBy: { type: string, description: The id of the user who resolved it }
        itemKind: { type: string, enum: [episode, movie] }
        title: { type: string }
        libraryId: { type: string }
        seriesTitle: { type: string }
        seasonId: { type: string, description: An episode's season }
        seasonNum: { type: integer }
        episodeNum: { type: integer }
        seasonOpen: { type: integer, description: Open reports on the same season (a film's, the film), this one included }

    AudioTrack:
      type: object
      description: One embedded audio stream — another language, a commentary, or a different mix.
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        streamIndex: { type: integer }
        codec: { type: string }
        language: { type: string, description: ISO 639-2 code as the file carries it }
        title: { type: string }
        channels: { type: integer, description: 2 = stereo, 6 = 5.1, 8 = 7.1 }
        bitRate: { type: integer }
        default: { type: boolean, description: The track the file marks as default }

    PlaySource:
      type: object
      description: >
        What the viewer is actually being sent, so the player's info panel can
        show it rather than leaving them to guess why a 4K title looks soft.
      properties:
        container: { type: string }
        videoCodec: { type: string }
        width: { type: integer }
        height: { type: integer }
        hdrFormat: { type: string, enum: [pq, hlg], description: Transfer characteristic when the source is HDR }
        dvProfile: { type: integer, description: Dolby Vision profile, absent when the stream carries none }
        video:
          type: string
          enum: [direct, remux, transcode]
          description: direct = untouched file; remux = video copied bit-for-bit, container changed; transcode = re-encoded.
        outHeight: { type: integer, description: Height being sent; absent when the video is untouched }
        audio: { type: string, enum: [direct, transcode] }
        audioCodec: { type: string, description: Codec being sent }

    SubtitleTrack:
      type: object
      properties:
        id: { type: string, format: uuid }
        language: { type: string }
        title: { type: string }
        codec: { type: string, description: subrip/ass/mov_text/vtt (text) or hdmv_pgs_subtitle/dvd_subtitle (image) }
        forced: { type: boolean }
        url: { type: string, description: WebVTT url; absent for image-based tracks }

    Person:
      type: object
      description: Someone credited on an item.
      properties:
        id: { type: string, format: uuid }
        tmdbId: { type: integer }
        name: { type: string }
        profile: { type: string, description: /artwork/... headshot }
        role: { type: string, description: Character for cast, job for crew }
        kind: { type: string, enum: [cast, crew] }

    MatchCandidate:
      type: object
      properties:
        tmdbId: { type: integer }
        title: { type: string }
        year: { type: integer }
        overview: { type: string }
        poster: { type: string, description: Absolute TMDB image URL }

    PlayState:
      type: object
      properties:
        itemId: { type: string, format: uuid }
        positionSecs: { type: integer, description: Resume position; 0 once watched or explicitly unwatched }
        watched: { type: boolean }
        updatedAt: { type: string }

    PlaySession:
      type: object
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        title: { type: string }
        segmentSecs: { type: integer }
        numSegments: { type: integer }
        accel:
          type: string
          description: >
            The transcode path this session was built with — a backend name
            such as "vaapi (/dev/dri/renderD128)", or "none" for software.
            Fixed for the life of the session even if the admin switch moves.

    Scan:
      type: object
      properties:
        id: { type: string, format: uuid }
        libraryId: { type: string, format: uuid }
        status: { type: string, enum: [running, completed, failed] }
        filesSeen: { type: integer }
        itemsCreated: { type: integer }
        error: { type: string }
        startedAt: { type: string }
        finishedAt: { type: string }

  responses:
    StorageUnavailable:
      description: >
        The library's storage is not reachable, did not answer within 15 s,
        or an earlier read of the same file is still blocked on it. The
        message is meant to be shown as it is: it names the library and the
        folder or file, and says what to check.
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    HAUnreachable:
      description: Home Assistant could not be reached, refused the token, or refused the call (its own message is passed on)
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    UpstreamFailed:
      description: Sonarr or Radarr could not be reached, refused the API key, or refused the webhook (its own message is passed on)
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    PrefLocked:
      description: The preference is locked by your administrator
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              key: { type: string }
              source: { type: string, enum: [group, server] }
              groupName: { type: string }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }

# Cineva configuration — every key the server reads, with its default.
#
# Copy to cineva.yaml and edit. The server looks for ./cineva.yaml, then
# /etc/cineva/cineva.yaml; --config names a file explicitly.
#
# Precedence: flags > CINEVA_* env vars > config file > these defaults.
#
# Every key maps to an env var by upper-casing it and replacing dots with
# underscores, prefixed with CINEVA_ — so `server.port` is CINEVA_SERVER_PORT
# and `metadata.tmdb.api_key` is CINEVA_METADATA_TMDB_API_KEY. The env name is
# given against each key below.
#
# This file is committed and is the reference for what is configurable. When
# a feature adds a key, add it here in the same change. Keep cineva.yaml
# itself out of git — it holds your API key.

server:
  # Interface to bind. 0.0.0.0 serves every interface; 127.0.0.1 restricts to
  # this machine.                                      CINEVA_SERVER_HOST
  host: 0.0.0.0
  # HTTP port.                                         CINEVA_SERVER_PORT
  port: 4747

database:
  # SQLite file. Relative paths resolve against the working directory.
  # Migrations apply automatically at startup.          CINEVA_DATABASE_PATH
  path: cineva.db

libraries:
  # Where cached posters, backdrops and headshots are written.
  #                                              CINEVA_LIBRARIES_ARTWORK_DIR
  artwork_dir: artwork
  # Automatic rescan interval (Go duration, e.g. "6h"). A rescan walks the
  # folders and skips unchanged files, so a short interval is cheap; new
  # downloads appear within it. "0" disables it and scans run only when
  # triggered — by hand, or by a Sonarr/Radarr connection's webhook.
  #                                           CINEVA_LIBRARIES_SCAN_INTERVAL
  scan_interval: "15m"
  # How long play history is kept, in days.
  #                                   CINEVA_LIBRARIES_HISTORY_RETENTION_DAYS
  history_retention_days: 90
  # Find TV intros and end credits in the background: "Skip intro" in the
  # player, and the up-next card and autoplay at the real credits. Each
  # episode's opening and closing stretch is decoded once and compared with
  # its neighbours'; the first pass over a large library reads a lot of
  # disk.                                CINEVA_LIBRARIES_INTRO_DETECTION
  intro_detection: true

transcode:
  # Scratch directory for HLS segments. Defaults to <tmp>/cineva-transcode.
  # Often tmpfs, which is why max_bytes exists.         CINEVA_TRANSCODE_DIR
  dir: /tmp/cineva-transcode
  # Target segment length in seconds.         CINEVA_TRANSCODE_SEGMENT_SECS
  segment_secs: 6
  # Cap on the segment cache, in bytes. 8 GiB is roughly two 4K films.
  # Exceeding it evicts least-recently-used sessions.
  #                                             CINEVA_TRANSCODE_MAX_BYTES
  max_bytes: 8589934592
  # Hardware acceleration: "auto" probes NVENC, QuickSync then VAAPI and uses
  # the first that opens; "none" forces software; "vaapi", "qsv" or "nvenc"
  # pin one backend.                              CINEVA_TRANSCODE_HWACCEL
  hwaccel: auto

auth:
  # How long a browser session lasts, in days.       CINEVA_AUTH_SESSION_DAYS
  session_days: 30
  # Set true when served over HTTPS so session cookies carry Secure. Leave
  # false for plain HTTP or the browser discards them.
  #                                               CINEVA_AUTH_SECURE_COOKIES
  secure_cookies: false
  # "picker" shows the profile list, Plex-style; "password" asks for a
  # username and password outright.                  CINEVA_AUTH_LOGIN_MODE
  login_mode: picker

metadata:
  # Two-letter region for age certifications — ratings differ by country, so
  # GB gives BBFC, US gives MPAA.                CINEVA_METADATA_CERT_REGION
  cert_region: GB
  tmdb:
    # Required for video metadata and artwork. Keep it out of git: set it
    # here in your own cineva.yaml, or pass CINEVA_METADATA_TMDB_API_KEY.
    #                                      CINEVA_METADATA_TMDB_API_KEY
    api_key: ""
  musicbrainz:
    # Enrich music from MusicBrainz and Cover Art Archive after embedded
    # tags.                            CINEVA_METADATA_MUSICBRAINZ_ENABLED
    enabled: true

stats:
  # How often the admin dashboard samples CPU, memory and disk, in seconds.
  #                                               CINEVA_STATS_SAMPLE_SECS
  sample_secs: 5
  # How long the persisted one-per-minute samples are kept, in hours. The
  # charts restore from these after a restart; raise it for a longer view.
  #                                           CINEVA_STATS_RETENTION_HOURS
  retention_hours: 24

log:
  # How much to log: debug, info, warn or error. Also the --log-level flag.
  #                                                       CINEVA_LOG_LEVEL
  level: info
  # auto: aligned, coloured lines in a terminal; one JSON object per line
  # anywhere else (systemd, Docker, a pipe). Or force pretty or json.
  # NO_COLOR turns the colours off.                      CINEVA_LOG_FORMAT
  format: auto

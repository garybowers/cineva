<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cineva">
  <!-- A film frame: the perforated strip that says "cinema" at 16px, where
       a letterform or a clapperboard turns to mush. Colours are the default
       theme's accent gradient. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#4dc3ff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0e1116"/>
  <rect x="12" y="10" width="40" height="44" rx="5" fill="url(#g)"/>
  <!-- Sprocket holes, knocked out of the strip on both edges. -->
  <g fill="#0e1116">
    <rect x="16" y="15" width="5" height="6" rx="1.5"/>
    <rect x="16" y="29" width="5" height="6" rx="1.5"/>
    <rect x="16" y="43" width="5" height="6" rx="1.5"/>
    <rect x="43" y="15" width="5" height="6" rx="1.5"/>
    <rect x="43" y="29" width="5" height="6" rx="1.5"/>
    <rect x="43" y="43" width="5" height="6" rx="1.5"/>
  </g>
  <!-- Play triangle in the frame window. -->
  <path d="M28 24.5 L40 32 L28 39.5 Z" fill="#0e1116"/>
</svg>

    <!-- SVG only: every browser that can run this app supports it, and one
         vector file covers every size instead of a pile of PNGs. The path is
         absolute because the app owns its routing: a relative href resolves
         against the current route, so /libraries/Movies asked the server for
         /libraries/Movies/favicon.svg and got a 404. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installability: the manifest names the app and its icons, and
         apple-touch-icon is the one thing iOS reads instead. Absolute paths
         for the same reason as the favicon above — the app owns its
         routing, so a relative href resolves against the current route. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
